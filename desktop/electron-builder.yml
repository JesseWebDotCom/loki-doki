appId: com.getmaipai.desktop
productName: MaiPai Desktop
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - build/tray*.png
  - package.json
mac:
  category: public.app-category.productivity
  # Unsigned Phase 1 (electron-builder still ad-hoc signs arm64, required to launch).
  # Install: right-click the app > Open, or `xattr -dr com.apple.quarantine`.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    NSMicrophoneUsageDescription: "MaiPai Desktop listens so you can talk to your companion."
win:
  target:
    - target: nsis
      arch: [x64]
# Styled install window. Layout (window size + icon centers) is canonical and is
# mirrored by scripts/make-dmg-background.sh and scripts/make-dsstore.sh so the
# Windows build path (build-mac-on-windows.ts) produces an identical DMG.
dmg:
  background: build/dmg-background.png
  iconSize: 112
  window:
    width: 600
    height: 420
  contents:
    - x: 150
      y: 215
      type: file
    - x: 450
      y: 215
      type: link
      path: /Applications
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Releases are created by .github/workflows/desktop-build.yml, not by the builder.
publish: null
