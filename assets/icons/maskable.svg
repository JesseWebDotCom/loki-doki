      <circle cx="549" cy="366" r="22"/>
      <circle cx="601" cy="366" r="22"/>
      <circle cx="341" cy="418" r="22"/>
      <circle cx="393" cy="418" r="22"/>
      <circle cx="445" cy="418" r="22"/>
      <circle cx="497" cy="418" r="22"/>
      <circle cx="549" cy="418" r="22"/>
      <circle cx="341" cy="470" r="22"/>
