    # ── Full-screen camera (perf test) ─────────────────────────────────────────
    # cam_img is repointed every new frame at the hardware-decoded RGB565 buffer
    # (see the 10 ms interval). lbl_fps shows the measured frame rate + bytes/frame.
    - id: page_camera
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - image:
            id: cam_img
            src: cam_placeholder
            align: CENTER
        - obj:
            align: TOP_RIGHT
            x: -12
            y: 12
            width: 230
            height: 56
            radius: 12
            bg_color: 0x000000
            bg_opa: 65%
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_fps
                  align: CENTER
                  text: "-- fps"
                  text_font: font_footer
                  text_color: 0x00FF66

    # ── Full-screen TOUCH TEST ──────────────────────────────────────────────────
    # Solid blue screen; wherever you press, a pink dot appears at that exact spot
    # and removes itself 1 s later. touch_surface fills the page and is the click
    # target; we read the press point from the active LVGL input device (already
    # rotation-corrected, so coords line up with the landscape screen). This proves
    # touch accuracy/latency across the whole panel.
    - id: page_touch
      bg_color: 0x1740C0          # blue background
      bg_opa: COVER
      widgets:
        # Full-screen BUTTON = the touch target. LVGL widget press events are the proven
        # touch path on this panel (the mute/mic buttons use them); the touchscreen
        # `on_touch` automation does NOT fire here because LVGL consumes the touch. On
        # press we read the rotation-corrected point from the active input device and
        # drop a pink dot there for 1 s, plus a running counter.
        - button:
            id: touch_btn
            x: 0
            y: 0
            width: 1280
            height: 720
            bg_color: 0x1740C0
            bg_opa: COVER
            radius: 0
            border_width: 0
            shadow_width: 0
            on_press:
              then:
                - lambda: |-
                    lv_indev_t *indev = lv_indev_get_act();
                    lv_point_t p = {0, 0};
                    if (indev) lv_indev_get_point(indev, &p);
                    const int r = 70;  // dot radius (px)
                    lv_obj_t *dot = lv_obj_create(lv_screen_active());
                    lv_obj_remove_style_all(dot);
                    lv_obj_set_size(dot, r * 2, r * 2);
                    lv_obj_set_style_radius(dot, LV_RADIUS_CIRCLE, 0);
                    lv_obj_set_style_bg_color(dot, lv_color_hex(0xFF3DAE), 0);  // pink
                    lv_obj_set_style_bg_opa(dot, LV_OPA_COVER, 0);
                    lv_obj_clear_flag(dot, LV_OBJ_FLAG_CLICKABLE);
                    lv_obj_set_pos(dot, p.x - r, p.y - r);
                    lv_obj_move_foreground(dot);
                    lv_timer_t *t = lv_timer_create([](lv_timer_t *tm) {
                      lv_obj_del((lv_obj_t *) lv_timer_get_user_data(tm));
                    }, 1000, dot);
                    lv_timer_set_repeat_count(t, 1);
                    static int n = 0; n++;
                    char buf[64];
                    snprintf(buf, sizeof(buf), "touches: %d   (%d,%d)", n, (int) p.x, (int) p.y);
                    lv_label_set_text(id(touch_count), buf);
            widgets:
              - label:
                  id: touch_count
                  align: TOP_MID
                  y: 18
                  text: "Touch the screen"
                  text_font: font_footer
                  text_color: 0xFFFFFF

    # ── Stream Deck (controller mode) ──────────────────────────────────────────
    # All button content is created dynamically in C++ (lokidoki_satellite.cpp)
    # when the server pushes stream_deck_config. This page is just the canvas.
    - id: page_stream_deck
      bg_color: 0x0f0f1a
      bg_opa: COVER

interval:
  # ── Camera: blit the latest hardware-decoded frame into the LVGL image ─────────
  # Runs on the main loop (LVGL is single-threaded); the fetch+decode happen on the
  # hw_jpeg background task. We only touch LVGL when a fresh frame is ready.
  - interval: 10ms
    then:
      - lambda: |-
          // The active page is driven by the server-pushed mode (see the display_mode
          // text sensor below); on boot it's the clock (normal). Only blit camera frames
          // while the camera page is actually showing, so the other modes keep the full
          // main loop (snappy touch response).
          if (lv_screen_active() != id(page_camera)->obj) return;
          if (!id(cam)->has_new_frame()) return;
          int w = id(cam)->frame_w();
          int h = id(cam)->frame_h();
          if (w <= 0 || h <= 0) { id(cam)->clear_new_frame(); return; }
          static lv_image_dsc_t dsc;
          dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
          dsc.header.cf = LV_COLOR_FORMAT_RGB565;
          dsc.header.w = w;
          dsc.header.h = h;
          dsc.header.stride = w * 2;
          dsc.data = id(cam)->front_buffer();
          dsc.data_size = (uint32_t) w * h * 2;
          lv_image_set_src(id(cam_img), &dsc);
          lv_obj_invalidate(id(cam_img));
          id(cam)->clear_new_frame();

  # ── Ambient: blit the latest server-rendered LAYOUT frame on the clock page ──────
  # In normal mode the server pushes this device its own rendered layout (theme +
  # widgets) over the same UDP/hw_jpeg path. Same decode path as the camera; we just
  # blit it on page_clock into ambient_img (on top of the native clock) instead.
  - interval: 100ms
    then:
      - lambda: |-
          if (lv_screen_active() != id(page_clock)->obj) return;
          // Native-LVGL mode draws its own dashboard, so server frames are ignored — EXCEPT
          // when swiped into the controller view, where the controller is still a
          // server-rendered surface blitted into ambient_img on top of the (hidden) dash.
          // Fully native now (dashboard AND controller) → no server frames are used. Keep
          // the "Server unreachable" banner hidden and bail.
          if (id(lvgl_mode)) {
            lv_obj_add_flag(id(offline_banner), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          static uint32_t last_frame_ms = 0;
          static bool revealed = false;
          // Fresh staleness timer each time we ENTER the controller view, so the normal
          // server-render spin-up doesn't immediately trip the "unreachable" banner.
          static bool prev_cv = false;
          if (id(controller_view) && !prev_cv) last_frame_ms = millis();
          prev_cv = id(controller_view);
          if (id(cam)->has_new_frame()) {
            int w = id(cam)->frame_w();
            int h = id(cam)->frame_h();
            if (w <= 0 || h <= 0) { id(cam)->clear_new_frame(); return; }
            static lv_image_dsc_t dsc;
            dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
            dsc.header.cf = LV_COLOR_FORMAT_RGB565;
            dsc.header.w = w;
            dsc.header.h = h;
            dsc.header.stride = w * 2;
            dsc.data = id(cam)->front_buffer();
            dsc.data_size = (uint32_t) w * h * 2;
            lv_image_set_src(id(ambient_img), &dsc);
            lv_obj_clear_flag(id(ambient_img), LV_OBJ_FLAG_HIDDEN);
            lv_obj_invalidate(id(ambient_img));
            // First controller frame is up → swap away from the native dashboard and arm the
            // touch grid (deferred from the swipe so there's no blank gap during the spin-up).
            if (id(controller_view)) {
              lv_obj_add_flag(id(lvgl_dash), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(touch_grid), LV_OBJ_FLAG_HIDDEN);
            }
            id(cam)->clear_new_frame();
            last_frame_ms = millis();
            // A fresh frame means the server is reachable → clear any offline banner.
            lv_obj_add_flag(id(offline_banner), LV_OBJ_FLAG_HIDDEN);
            // First real layout frame = connected. Drop the "Connecting" splash and
            // reveal the voice controls (they must NEVER show on the splash). Once only.
            if (!revealed) {
              revealed = true;
              lv_obj_add_flag(id(lbl_brand), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(lbl_connecting), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(boot_logo_img), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(btn_wake), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(lbl_wake), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(btn_voice), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(lbl_voice), LV_OBJ_FLAG_HIDDEN);
              // Reflect the RESTORED (persisted) mute settings on the controls.
              bool micMuted = id(satellite)->is_mic_muted();
              lv_label_set_text(id(lbl_wake), micMuted ? "Muted" : "Listening");
              lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(micMuted ? 0x4B5563 : 0x7C3AED), 0);
              if (micMuted) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              bool audMuted = id(satellite)->is_audio_muted();
              lv_label_set_text(id(lbl_voice), audMuted ? "Sound off" : "Sound on");
              lv_obj_set_style_bg_color(id(btn_voice), lv_color_hex(audMuted ? 0x4B5563 : 0x2563EB), 0);
              if (audMuted) { lv_obj_add_flag(id(ic_spk_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_spk_off), LV_OBJ_FLAG_HIDDEN); }
              else { lv_obj_clear_flag(id(ic_spk_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_spk_off), LV_OBJ_FLAG_HIDDEN); }
            }
          }
          // Staleness watchdog: the server pushes layout frames continuously, so a gap
          // means it's offline. Once we've seen ≥1 frame, no frame for 6 s → show the
          // offline banner (it hides again the instant frames resume, above).
          if (id(controller_view) && revealed && last_frame_ms != 0 &&
              (uint32_t) (millis() - last_frame_ms) > 10000) {
            lv_obj_clear_flag(id(offline_banner), LV_OBJ_FLAG_HIDDEN);
          }

  # ── Camera: FPS + bytes/frame readout (from the decoder's running counters) ────
  - interval: 500ms
    then:
      - lambda: |-
          static uint32_t last_frames = 0;
          static uint32_t last_recv = 0;
          static uint32_t last_ms = 0;
          uint32_t now = millis();
          uint32_t f = id(cam)->frames();
          uint32_t rcv = id(cam)->received();
          float fps = 0, rfps = 0;
          if (last_ms != 0 && now > last_ms) {
            fps = (f - last_frames) * 1000.0f / (now - last_ms);
            rfps = (rcv - last_recv) * 1000.0f / (now - last_ms);
          }
          char buf[48];
          snprintf(buf, sizeof(buf), "%.0f fps  %ukB", fps, id(cam)->last_bytes() / 1024);
          lv_label_set_text(id(lbl_fps), buf);
          // received_fps vs decoded_fps: received≈decoded → decode-limited (good);
          // received≫decoded → still drop/starve-limited.
          ESP_LOGI("tab5cam", "decoded=%.1ffps received=%.1ffps last_bytes=%u dims=%dx%d",
                   fps, rfps, id(cam)->last_bytes(), id(cam)->frame_w(), id(cam)->frame_h());
          last_frames = f;
          last_recv = rcv;
          last_ms = now;

  # ── Swipe left/right to toggle between the Display and Controller views ──────────
  # Single content page: the blit (ambient_img) shows whichever view the SERVER renders.
  # Swiping just tells the server which view to stream (set_view) and reveals/hides the
  # invisible touch grid that turns taps on the rendered controller image into button
  # presses. The bottom mic/sound controls + status + reply stay put, so the controller
  # behaves exactly like the display.
  - interval: 50ms
    then:
      - lambda: |-
          // Only the ambient clock page is swipeable (not the camera/touch test pages).
          if (lv_screen_active() != id(page_clock)->obj) return;
          lv_indev_t *indev = lv_indev_get_next(nullptr);
          if (!indev) return;
          // MANUAL swipe detection (LVGL's gesture_dir needed an unreasonably fast/long
          // flick on this panel). Track press → release and measure the horizontal delta.
          static bool down = false;
          static int sx = 0, sy = 0, lx = 0, ly = 0;
          static int active_cell = -1;   // the SELECTED tile — stays depressed until another tap
          static int touch_cell = -1;    // tile under the finger this stroke
          static int prev_active = -1;   // active before this stroke (restored if it's a swipe)
          if (lv_indev_get_state(indev) == LV_INDEV_STATE_PRESSED) {
            lv_point_t p; lv_indev_get_point(indev, &p);
            if (!down) {
              down = true; sx = p.x; sy = p.y; id(g_swiping) = false;
              // Sink the touched tile immediately; it becomes the ACTIVE (selected) tile and
              // releases the previously-active one. A swipe cancels this (below), so it stays
              // depressed while the media loads and until another tile is tapped.
              if (id(controller_view) && p.y < 480) {
                touch_cell = (p.y / 240) * 16 + (p.x / 256);
                prev_active = active_cell;
                if (active_cell >= 0 && active_cell != touch_cell)
                  id(satellite)->set_cell_pressed(active_cell / 16, active_cell % 16, false);
                id(satellite)->set_cell_pressed(touch_cell / 16, touch_cell % 16, true);
                active_cell = touch_cell;
              }
            }
            lx = p.x; ly = p.y;
            int mv = lx - sx; if (mv < 0) mv = -mv;
            if (mv > 55) {
              id(g_swiping) = true;   // moved → a swipe, not a tap: cancel + restore prev active
              if (touch_cell >= 0) {
                if (touch_cell != prev_active) id(satellite)->set_cell_pressed(touch_cell / 16, touch_cell % 16, false);
                active_cell = prev_active;
                if (prev_active >= 0) id(satellite)->set_cell_pressed(prev_active / 16, prev_active % 16, true);
                touch_cell = -1;
              }
            }
            return;
          }
          if (!down) return;
          down = false;
          touch_cell = -1;   // tap confirmed → the pressed tile STAYS depressed as the active item
          // A screen swipe must START in the upper BACKGROUND area — not on the bottom
          // control strip (media player + mic/speaker), so those stay put and keep working
          // while only the background swaps between dashboard and controller.
          if (sy >= 500) return;
          int dx = lx - sx, dy = ly - sy;
          int adx = dx < 0 ? -dx : dx, ady = dy < 0 ? -dy : dy;
          if (adx < 120 || adx < ady * 2) return;   // decisive HORIZONTAL swipe only
          // Swipe LEFT → NATIVE controller grid; swipe RIGHT → back to the native dashboard.
          // Both are on-device LVGL now (no server-rendered frames), so the mic/sound/player
          // band on page_clock persists across both.
          if (dx < 0 && !id(controller_view)) {
            id(controller_view) = true;
            lv_obj_clear_flag(id(ctrl_native), LV_OBJ_FLAG_HIDDEN);   // native grid visuals
            lv_obj_clear_flag(id(touch_grid), LV_OBJ_FLAG_HIDDEN);    // invisible input layer on top
            lv_obj_add_flag(id(lvgl_dash), LV_OBJ_FLAG_HIDDEN);       // hide the dashboard
          } else if (dx > 0 && id(controller_view)) {
            id(controller_view) = false;
            lv_obj_add_flag(id(ctrl_native), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(touch_grid), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lvgl_dash), LV_OBJ_FLAG_HIDDEN);
          }

  # ── Native LVGL dashboard: reveal it once, then tick the clock from on-board SNTP ──
  # Runtime rotation is disabled (it corrupted the panel), so the dashboard renders cleanly.
  - interval: 1s
    then:
      - lambda: |-
          // Delayed cover retry FIRST (it lost the shared HTTP client to the atlas) — but not
          // in the same tick we (re)fetch the atlas, so they don't collide again.
          if (id(cover_retry_at) != 0 && millis() >= id(cover_retry_at)) {
            id(cover_retry_at) = 0;
            id(cover_online)->update();
          } else if (id(satellite)->take_atlas_dirty()) {
            // (Re)fetch the controller thumbnail atlas whenever the native grid was rebuilt.
            std::string u = std::string("http://${lokidoki_host}:${lokidoki_http_port}/api/pod/controller-atlas/")
                          + id(satellite)->hwid() + ".jpg";
            id(ctrl_atlas)->set_url(u.c_str());
            id(ctrl_atlas)->update();
          }
  # Self-heal + state telemetry: if the grid built its tiles but the atlas never loaded (a
  # failed fetch/decode), refetch it; and log the actual surface state so it's verifiable.
  - interval: 10s
    then:
      - lambda: |-
          bool tiles = id(satellite)->has_tiles();
          bool loaded = id(satellite)->atlas_loaded();
          if (id(satellite)->atlas_wanted() && !loaded) id(satellite)->request_atlas_refetch();
          ESP_LOGI("state", "ctrl=%d atlas[tiles=%d loaded=%d] media_bar=%d media_playing=%d",
                   (int) id(controller_view), (int) tiles, (int) loaded,
                   (int) !lv_obj_has_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN),
                   (int) id(media_playing));
  - interval: 1s
    then:
      - lambda: |-
          // One-time SETUP once LVGL is up (register image tables etc.) — but do NOT reveal
          // the dashboard yet: keep the loading screen up until the clock is real.
          static bool inited = false;
          static bool revealed = false;
          static uint32_t setup_at = 0;
          if (!inited) {
            inited = true;
            setup_at = millis();
            id(lvgl_mode) = true;
            // Register the 16 gradient strips + make the background TILE them full-screen.
            const lv_image_dsc_t **bt = wxfx::bg_table();
            bt[0]=id(img_bg_0)->get_lv_image_dsc();   bt[1]=id(img_bg_1)->get_lv_image_dsc();
            bt[2]=id(img_bg_2)->get_lv_image_dsc();   bt[3]=id(img_bg_3)->get_lv_image_dsc();
            bt[4]=id(img_bg_4)->get_lv_image_dsc();   bt[5]=id(img_bg_5)->get_lv_image_dsc();
            bt[6]=id(img_bg_6)->get_lv_image_dsc();   bt[7]=id(img_bg_7)->get_lv_image_dsc();
            bt[8]=id(img_bg_8)->get_lv_image_dsc();   bt[9]=id(img_bg_9)->get_lv_image_dsc();
            bt[10]=id(img_bg_10)->get_lv_image_dsc(); bt[11]=id(img_bg_11)->get_lv_image_dsc();
            bt[12]=id(img_bg_12)->get_lv_image_dsc(); bt[13]=id(img_bg_13)->get_lv_image_dsc();
            bt[14]=id(img_bg_14)->get_lv_image_dsc(); bt[15]=id(img_bg_15)->get_lv_image_dsc();
            lv_obj_set_size(id(bg_img), 1280, 720);
            lv_image_set_inner_align(id(bg_img), LV_IMAGE_ALIGN_TILE);
            wxfx::sun_dsc() = id(img_sun)->get_lv_image_dsc();
            const lv_image_dsc_t **st = wxfx::sprite_table();
            st[0]=id(img_spr_0)->get_lv_image_dsc(); st[1]=id(img_spr_1)->get_lv_image_dsc();
            st[2]=id(img_spr_2)->get_lv_image_dsc(); st[3]=id(img_spr_3)->get_lv_image_dsc();
            st[4]=id(img_spr_4)->get_lv_image_dsc(); st[5]=id(img_spr_5)->get_lv_image_dsc();
            st[6]=id(img_spr_6)->get_lv_image_dsc(); st[7]=id(img_spr_7)->get_lv_image_dsc();
            st[8]=id(img_spr_8)->get_lv_image_dsc();
            st[9]=id(img_spr_9)->get_lv_image_dsc(); st[10]=id(img_spr_10)->get_lv_image_dsc();
            st[11]=id(img_spr_11)->get_lv_image_dsc(); st[12]=id(img_spr_12)->get_lv_image_dsc();
            st[13]=id(img_spr_13)->get_lv_image_dsc(); st[14]=id(img_spr_14)->get_lv_image_dsc();
            st[15]=id(img_spr_15)->get_lv_image_dsc(); st[16]=id(img_spr_16)->get_lv_image_dsc();
            st[17]=id(img_spr_17)->get_lv_image_dsc(); st[18]=id(img_spr_18)->get_lv_image_dsc();
            st[19]=id(img_spr_19)->get_lv_image_dsc();
            st[20]=id(img_spr_20)->get_lv_image_dsc(); st[21]=id(img_spr_21)->get_lv_image_dsc();
            st[22]=id(img_spr_22)->get_lv_image_dsc(); st[23]=id(img_spr_23)->get_lv_image_dsc();
            st[24]=id(img_spr_24)->get_lv_image_dsc(); st[25]=id(img_spr_25)->get_lv_image_dsc();
            st[26]=id(img_spr_26)->get_lv_image_dsc(); st[27]=id(img_spr_27)->get_lv_image_dsc();
            srand(millis());   // vary the random character mix from boot to boot
          }
          // Reveal the dashboard ONLY once the on-board clock is real (SNTP synced) — until
          // then the loading screen stays up so the user never sees pre-sync tofu boxes or a
          // half-laid-out clock. 20s hard fallback so a device with no time still comes up.
          if (!revealed && (id(tab5_time)->now().is_valid() || (millis() - setup_at) > 20000)) {
            revealed = true;
            ESP_LOGI("boot", "dashboard revealed at %ums (clock_valid=%d)",
                     (unsigned) millis(), (int) id(tab5_time)->now().is_valid());
            lv_obj_add_flag(id(boot_logo_img), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_brand), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_connecting), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ambient_img), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(offline_banner), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lvgl_dash), LV_OBJ_FLAG_HIDDEN);
            // Reveal the voice controls together with the dashboard + reflect mute state.
            lv_obj_clear_flag(id(btn_wake), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_wake), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(btn_voice), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_voice), LV_OBJ_FLAG_HIDDEN);
            bool micMuted = id(satellite)->is_mic_muted();
            lv_label_set_text(id(lbl_wake), micMuted ? "Muted" : "Listening");
            lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(micMuted ? 0x4B5563 : 0x7C3AED), 0);
            if (micMuted) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
            else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
            bool audMuted = id(satellite)->is_audio_muted();
            lv_label_set_text(id(lbl_voice), audMuted ? "Sound off" : "Sound on");
            lv_obj_set_style_bg_color(id(btn_voice), lv_color_hex(audMuted ? 0x4B5563 : 0x2563EB), 0);
            if (audMuted) { lv_obj_add_flag(id(ic_spk_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_spk_off), LV_OBJ_FLAG_HIDDEN); }
            else { lv_obj_clear_flag(id(ic_spk_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_spk_off), LV_OBJ_FLAG_HIDDEN); }
          }
          // Tick the clock + date locally every second (no server round-trip).
          if (lv_screen_active() != id(page_clock)->obj) return;
          ESPTime t = id(tab5_time)->now();
          if (!t.is_valid()) return;
          char buf[8];
          int hr = t.hour % 12; if (hr == 0) hr = 12;
          snprintf(buf, sizeof(buf), "%d:%02d", hr, t.minute);
          lv_label_set_text(id(lv_clock), buf);
          char sec[6];
          snprintf(sec, sizeof(sec), ":%02d", t.second);
          lv_label_set_text(id(lv_seconds), sec);
          lv_label_set_text(id(lv_ampm), t.hour < 12 ? "AM" : "PM");
          char dow[24];
          t.strftime(dow, sizeof(dow), "%A, %b");
          char date[40];
          snprintf(date, sizeof(date), "%s %d", dow, t.day_of_month);
          lv_label_set_text(id(lv_date), date);
          // Advance the media position locally between (infrequent) server pushes so the
          // seek bar moves smoothly. Skipped while the user is dragging the slider.
          if (id(media_playing) && id(media_dur_s) > 0 &&
              !lv_obj_has_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN) &&
              !(lv_obj_get_state(id(media_seek)) & LV_STATE_PRESSED)) {
            if (id(media_pos_s) < id(media_dur_s)) id(media_pos_s)++;
            lv_slider_set_value(id(media_seek), (int) ((long) id(media_pos_s) * 1000 / id(media_dur_s)), LV_ANIM_OFF);
          }

  # Cheap stepped rotation for the (now bigger) clear-day sun (~15×/s, not every frame).
  - interval: 66ms
    then:
      - lambda: 'wxfx::tick_sun();'


# Conversation state from the satellite (idle/connecting/listening/thinking/talking).
# On each change we either hide the overlay (back to the clock) or show a bold,
# color-coded full-screen state so wake + thinking are instantly obvious.
text_sensor:
  # Server-pushed screen mode (Admin → Devices → Testing). Switches the whole UI:
  #   normal      → the ambient clock dashboard
  #   camera-test → full-screen camera (public test feed, see backend)
  #   touch-test  → blue screen, pink dot where you press
  - platform: template
    id: display_mode
    on_value:
      then:
        - lambda: |-
            const std::string &m = x;
            ESP_LOGI("displaymode", "screen mode → %s", m.c_str());
            if (m == "camera-test") {
              lv_screen_load(id(page_camera)->obj);
            } else if (m == "touch-test") {
              lv_screen_load(id(page_touch)->obj);
            } else if (m == "stream-deck") {
              lv_screen_load(id(page_stream_deck)->obj);
            } else {  // "normal" (or anything unknown) → ambient clock
              lv_screen_load(id(page_clock)->obj);
            }
  - platform: template
    id: face_state
    on_value:
      then:
        - lambda: |-
            const std::string &s = x;
            // Auto-dismiss spoken reply text: remember once speech starts, then 1 s after
            // we return to idle, clear the on-screen reply (hide_reply_soon).
            if (s == "talking") id(was_speaking) = true;
            if (s == "idle" && id(was_speaking)) { id(was_speaking) = false; id(hide_reply_soon).execute(); }
            if (s == "listening") {
              lv_label_set_text(id(state_label), "Listening");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x16A34A), 0);  // green
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else if (s == "thinking") {
              lv_label_set_text(id(state_label), "Thinking");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x2563EB), 0);  // blue
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else if (s == "talking") {
              lv_label_set_text(id(state_label), "Speaking");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x0891B2), 0);  // cyan
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else {
              // idle / connecting → status pill hidden, just the clock
              lv_obj_add_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            }
            // The LEFT (mic) button becomes a STOP button while a turn is active — a tap
            // aborts it. Idle → it goes back to the mic mute/talk control.
            const bool active = (s == "listening" || s == "thinking" || s == "talking");
            id(ui_active) = active;
            if (active) {
              lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(ic_stop), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(0xDC2626), 0);  // red = stop
              lv_label_set_text(id(lbl_wake), (s == "thinking") ? "Stop thinking" : (s == "talking") ? "Stop speaking" : "Stop listening");
            } else {
              lv_obj_add_flag(id(ic_stop), LV_OBJ_FLAG_HIDDEN);
              const bool muted = id(satellite)->is_mic_muted();
              if (muted) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(muted ? 0x4B5563 : 0x7C3AED), 0);
              lv_label_set_text(id(lbl_wake), muted ? "Muted" : "Listening");
            }
  # The companion's typed reply (text-only reply mode) — show it bottom-middle.
  - platform: template
    id: reply_text
    on_value:
      then:
        - lambda: |-
            // Show the reply in the MAIN content band (covers the clock/weather); the
            // top status row + bottom controls stay visible. Buttons are never hidden.
            if (x.empty()) {
              lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(btn_dismiss_reply), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(id(lbl_reply), x.c_str());
              lv_obj_clear_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(btn_dismiss_reply), LV_OBJ_FLAG_HIDDEN);
            }
        # Fallback auto-hide for TEXT-only replies (no speech to bound them): clears the
        # reply ~22 s after the LAST chunk. Spoken replies are dismissed 1 s after speech
        # ends instead (see face_state → hide_reply_soon), which fires first.
        - script.execute: hide_reply_timer

  # ── NATIVE LVGL experiment ───────────────────────────────────────────────────────
  # Render mode from the assigned template's descriptor ("lvgl" → draw the dashboard
  # natively; anything else → the server JPEG blit). Switches the whole render path.
  - platform: template
    id: render_mode
    on_value:
      then:
        - lambda: |-
            const bool lvgl = (x == "lvgl");
            id(lvgl_mode) = lvgl;
            // NOTE: the dashboard + voice-control reveal is owned by the 1s interval, which
            // holds the loading screen until the on-board clock is real (SNTP synced) — so we
            // do NOT reveal here (that fired before the time was valid → tofu boxes at boot).
            // TEST BUILD: never switch back to the JPEG path — the dashboard is forced on
            // in the 1s interval and stays native regardless of what the server says.

  # Live data feed (weather + photo state) for the native dashboard — a JSON string we
  # parse here to fill the weather card, pick the sky gradient, and (re)load the photo.
  - platform: template
    id: display_data
    on_value:
      then:
        - lambda: |-
            json::parse_json(x, [](JsonObject root) -> bool {
              if (root["weather"].is<JsonObject>()) {
                JsonObject w = root["weather"].as<JsonObject>();
                int temp = w["temp"] | 0;
                int hi = w["high"] | 0;
                int lo = w["low"] | 0;
                int code = w["code"] | 0;
                bool day = w["is_day"] | true;
                std::string text = w["text"].as<std::string>();
                std::string loc = w["location"].as<std::string>();
                char buf[32];
                snprintf(buf, sizeof(buf), "%d°", temp);
                lv_label_set_text(id(lv_wx_temp), buf);
                if (!text.empty()) text[0] = (char) toupper(text[0]);
                lv_label_set_text(id(lv_wx_cond), text.c_str());
                // Per-condition gradient background (day/night), animated effect, then
                // seasonal/temperature ambience (petals/leaves/fireflies/heat-shimmer).
                wxfx::set_bg(id(bg_img), wxfx::gradient_key(code, day));
                wxfx::apply_weather_fx(id(lv_wx_fx), code, day);
                { ESPTime nt = id(tab5_time)->now();
                  wxfx::apply_seasonal(id(lv_wx_fx), code, day, nt.is_valid() ? nt.month : 6, temp); }
                snprintf(buf, sizeof(buf), "H %d°   L %d°", hi, lo);
                lv_label_set_text(id(lv_wx_hilo), buf);
                lv_label_set_text(id(lv_wx_loc), loc.c_str());
                wxfx::apply_apparel(id(lv_wear0), id(lv_wear1), id(lv_wear2), code, day, temp);
              }
              // ── Native media player bar ──
              if (root["media"].is<JsonObject>()) {
                JsonObject m = root["media"].as<JsonObject>();
                std::string mt = m["title"].as<std::string>();
                std::string ma = m["artist"].as<std::string>();
                bool playing = m["isPlaying"] | false;
                int mpos = m["position"] | 0;
                int mdur = m["duration"] | 0;
                int mrev = m["rev"] | 0;
                id(media_dur_s) = mdur;
                id(media_pos_s) = mpos;
                id(media_playing) = playing;
                lv_label_set_text(id(media_title), mt.c_str());
                lv_label_set_text(id(media_artist), ma.c_str());
                lv_label_set_text(id(media_play_icon), playing ? "\U0000E034" : "\U0000E037");  // pause : play
                if (mdur > 0 && !(lv_obj_get_state(id(media_seek)) & LV_STATE_PRESSED))
                  lv_slider_set_value(id(media_seek), (int) ((long) mpos * 1000 / mdur), LV_ANIM_OFF);
                else if (mdur <= 0)
                  lv_slider_set_value(id(media_seek), 0, LV_ANIM_OFF);
                static int last_media_rev = -1;          // a new track un-dismisses the bar + refetches art
                if (mrev != last_media_rev) {
                  id(media_dismissed) = false; last_media_rev = mrev;
                  // Fetch this track's cover. The ?rev= cache-buster makes each track a NEW
                  // URL so online_image actually re-downloads (a static URL gets reused).
                  // The server 404s when there's no art → on_error → placeholder note.
                  std::string u = std::string("http://${lokidoki_host}:${lokidoki_http_port}/api/pod/cover/")
                                + id(satellite)->hwid() + ".jpg?rev=" + std::to_string(mrev);
                  id(cover_online)->set_url(u.c_str());
                  id(cover_retries) = 0; id(cover_retry_at) = 0;   // fresh track → fresh retry budget
                  id(cover_online)->update();
                }
                if (!id(media_dismissed)) lv_obj_clear_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);   // nothing playing
                id(media_playing) = false;
                id(media_dur_s) = 0;
              }
              return true;
            });

# Tap-vs-hold disambiguation for the mic button: on_long_press (push-to-talk) sets this,
# and the on_click that fires on release checks it so a HOLD doesn't also toggle mute.
globals:
  - id: ptt_was_hold
    type: bool
    restore_value: no
    initial_value: 'false'
  # True while a turn is active (listening/thinking/speaking). The mic button becomes a
  # Stop button during this window, so a tap aborts the turn instead of toggling mute.
  - id: ui_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # True once a reply has STARTED speaking, so when we return to idle we know it was a
  # spoken reply and can auto-dismiss its on-screen text 1 s after the speech ends.
  - id: was_speaking
    type: bool
    restore_value: no
    initial_value: 'false'
  # True while the controller (button-grid) view is showing instead of the ambient display.
  - id: controller_view
    type: bool
    restore_value: no
    initial_value: 'false'
  # True once the current touch has moved enough to be a SWIPE (not a tap) — the controller
  # grid buttons check it so a swipe doesn't also fire a button (accidental video playback).
  - id: g_swiping
    type: bool
    restore_value: no
    initial_value: 'false'
  # ── Native media player bar state (pushed from the server's display.data `media`) ──
  - id: media_dur_s     # current track duration (s); 0 = unknown/live (seek disabled)
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_pos_s     # current position (s) — ticked locally between server pushes
    type: int
    restore_value: no
    initial_value: '0'
  - id: media_playing   # transport state (drives the play/pause icon + local position tick)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: media_dismissed # user tapped ✕ — stay hidden until the next track (rev change)
    type: bool
    restore_value: no
    initial_value: 'false'
  # Cover art shares the ONE http_request client with the controller atlas; a big atlas
  # download can starve the cover fetch. These drive a bounded, delayed cover retry.
  - id: cover_retry_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cover_retries
    type: int
    restore_value: no
    initial_value: '0'
  # NATIVE LVGL experiment: true when the assigned template's renderer is 'lvgl' — the
  # device draws the dashboard itself (lvgl_dash) and ignores the server JPEG blit.
  - id: lvgl_mode
    type: bool
    restore_value: no
    initial_value: 'false'

# Reply-panel hide logic. hide_reply_now is the single clear path (panel + Dismiss button);
# the two timers just call it after their delay.
script:
  - id: hide_reply_now
    then:
      - lambda: |-
          // Reply done → clear the content panel; the clock/weather shows through again.
          lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(btn_dismiss_reply), LV_OBJ_FLAG_HIDDEN);
  # TEXT-only fallback: clear ~22 s after the last streamed chunk (mode: restart resets
  # the countdown on each chunk, so it only fires once the reply has settled).
  - id: hide_reply_timer
    mode: restart
    then:
      - delay: 22s
      - script.execute: hide_reply_now
  # SPOKEN replies: clear 1 s after the speech finishes (face_state talking → idle).
  - id: hide_reply_soon
    mode: restart
    then:
      - delay: 1s
      - script.execute: hide_reply_now

external_components:
  # The shared Wyoming/Loki-Doki satellite runtime (firmware/components/).
  - source:
      type: local
      path: ../components

# ── The Loki Doki satellite link — replaces HA's voice_assistant pipeline ──────
# Streams the mic up and plays the reply down over our Wyoming gateway; wake word
# runs server-side. No RGB LED on the Tab5 — instead the conversation state is
# mirrored to the `face_state` text sensor, which drives the LVGL overlay above.
lokidoki_satellite:
  id: satellite
  host: ${lokidoki_host}
  port: ${lokidoki_port}
  model: tab5
  microphone: tab5_microphone
  speaker: tab5_speaker
  face_sensor: face_state
  mode_sensor: display_mode   # server-pushed screen mode (Admin → Devices → Testing)
  reply_sensor: reply_text    # companion's typed reply for text-only mode
  render_sensor: render_mode  # native-LVGL experiment: descriptor renderer ("lvgl"/"jpeg")
  data_sensor: display_data   # native-LVGL experiment: live weather + photo feed (JSON)
  backlight: backlight       # idle dimming, configured centrally via device settings
