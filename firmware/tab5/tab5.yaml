# Loki Doki — M5Stack Tab5 voice satellite (ESPHome)
#
# A 5" ESP32-P4 tablet (1280×720 MIPI-DSI, GT911 touch, ES7210 mic array + ES8388
# speaker codec, ESP32-C6 co-processor for Wi-Fi over SDIO) turned into a Loki Doki
# voice satellite. Like the Atom Echo it streams 16 kHz mic PCM to the Wyoming
# gateway and plays the companion's spoken reply; wake word runs SERVER-SIDE.
#
# IMPORTANT — the hardware half of this file (board, esp32_hosted, psram, i2c,
# esp_ldo, pi4ioe5v6408 expanders, i2s_audio pins, es7210/es8388 audio, mipi_dsi
# display, gt911 touch, backlight, rtc, power switches/sensors) is copied VERBATIM
# from the official ESPHome device config so the pin map is known-good:
#   https://devices.esphome.io/devices/m5stack-tab5/
#   https://github.com/esphome/devices.esphome.io/blob/main/src/docs/devices/M5Stack-Tab5/config.yaml
# Do NOT "tune" those values. What we change vs. upstream is only the PIPELINE: we
# drop Home Assistant's voice_assistant/micro_wake_word/media_player and use our own
# `lokidoki_satellite` component (server-side wake, our Wyoming framing) — exactly
# how firmware/atom-echo/atom-echo.yaml does it.
#
# Onboarding is no-typing: flash once over USB (home Wi-Fi + server address are baked
# in at build time by Admin → Devices → "Add a device"), power on, then Claim the
# device when it announces itself.

substitutions:
  name: lokidoki-tab5
  friendly_name: LokiDoki Tab5
  lokidoki_host: "192.168.1.50"   # ← your Loki Doki server's LAN IP (injected at build)
  lokidoki_port: "10700"          # POD_GATEWAY_PORT (default 10700)
  lokidoki_http_port: "3000"      # HTTP API port — serves the server-rendered display
  # Home Wi-Fi is injected at build time by the app, so a flashed device auto-joins
  # on power-up — no per-device Wi-Fi step. Left blank here, it falls back to the
  # setup AP + Improv (serial) provisioning.
  wifi_ssid: ""
  wifi_password: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: "2026.6.0"          # Tab5 needs recent esp32_hosted / mipi_dsi support
  on_boot:
    then:
      # Read the RTC time once when the system boots (upstream).
      - rx8130.read_time:
      # Route the ES8388 DAC to LINE1 — the onboard speaker amp. Upstream exposes
      # this as a manual select; we set it automatically so audio works out of the box.
      - select.set:
          id: dac_output_select
          option: "LINE1"
      # Force the display backlight fully on at boot (don't rely on restore state).
      - light.turn_on:
          id: backlight
          brightness: 100%
      # Start with the mic OFF so the device doesn't wake on TV/background audio; the
      # user taps the on-screen MIC button to start listening.
      - lambda: 'id(satellite)->set_mic_enabled(false);'
      # NOTE: switching to page_camera happens from the render interval below (a
      # one-time lv_screen_load once LVGL is fully up) — doing it here in on_boot ran
      # too early and silently no-op'd (telemetry showed on_cam_page=0).

esp32:
  variant: esp32p4
  flash_size: 16MB
  # This unit is a pre-rev3 (ECO2) P4 engineering sample — its ROM reports
  # `esp32p4-eco2`. ESPHome's own build guidance for a pre-rev3 board is to set
  # this; it targets the correct silicon revision (a rev3-built image throws
  # "Illegal instruction" at boot on ECO silicon) and caps the CPU at 360 MHz
  # (400 MHz is engineering-sample-unsafe). Drop it for production (rev3+) Tab5s.
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# Wi-Fi lives on the ESP32-C6 co-processor, reached over SDIO (esp32_hosted).
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

logger:
  hardware_uart: USB_SERIAL_JTAG
  # Audio is high-rate; keep the log level modest so it doesn't starve the loop.
  level: INFO

# Over-the-air updates after the first USB flash.
ota:
  - platform: esphome

# ── Wi-Fi: home network baked in at build time (auto-joins anywhere); the setup AP +
# Improv below are the fallback when no credentials were injected (wifi_ssid=""). ──
wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  # Keep the radio fully awake for steady real-time audio streaming + reconnects.
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

# Wi-Fi provisioning over USB serial when credentials weren't baked in.
improv_serial:

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

# On-board GPIO expanders (everything power/reset-related hangs off these).
pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

# ── Audio: ES7210 ADC (mic array) + ES8388 DAC (speaker), one shared I2S bus.
# Mic is 16 kHz (what the gateway expects); the speaker runs at 16 kHz too because
# our satellite streams raw 16 kHz mono int16 PCM down (it does not resample). ──
i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8388
    id: es8388_dac

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    # 16 kHz to match the raw PCM our satellite plays back (see note above).
    sample_rate: 16000
    # Big buffer so playback rides through the gaps between streamed TTS sentences
    # (the server synthesizes sentence-by-sentence; a small buffer underruns → the
    # reply "cuts out"). The Tab5 has PSRAM to spare. ~2 s of 16 kHz mono = ~64 KB.
    buffer_duration: 2000ms

# DAC/ADC routing selects (LINE1 = onboard speaker; set on boot above).
select:
  - platform: es8388
    dac_output:
      id: dac_output_select
      name: DAC Output
    adc_input_mic:
      name: ADC Input Mic

# ── Display + touch. The panel is driven by LVGL (see the `lvgl:` block) which
# renders the ambient clock dashboard + conversation-state faces. With LVGL present
# ESPHome skips the test card automatically. ──
display:
  - platform: mipi_dsi
    id: tab5_display
    dimensions:
      height: 1280
      width: 720
    # This unit's panel is the V2 (the V1 init sequence leaves it lit-but-blank).
    model: M5Stack-Tab5-V2
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  - platform: gt911
    interrupt_pin: GPIO23
    # Poll actively (not interrupt-only) so LVGL reliably gets touch even when the
    # main loop is busy — interrupt-only reads were being missed.
    update_interval: 33ms
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    id: touch

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

time:
  - platform: rx8130
    id: rtc_time
    i2c_id: bsp_bus
    update_interval: never
    timezone: UTC
  # Network time for the on-screen clock (timezone auto-detected from the build host).
  - platform: sntp
    id: tab5_time

# ── Power / charging plumbing (all via the I/O expanders). speaker_enable must be
# ON for any audio to come out, so it restores ALWAYS_ON. ──
switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2

binary_sensor:
  - platform: gpio
    id: charging
    name: "Charging Status"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7

sensor:
  - platform: ina226
    address: 0x41
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    bus_voltage:
      id: battery_voltage
      name: "Battery Voltage"
    current:
      id: battery_current
      name: "Battery Current"
      # Positive means discharging; negative means charging.

# Big clock font (downloaded from Google Fonts at build time). The time glyph set
# is limited to what a clock needs so the large size stays small in flash.
font:
  - file: "gfonts://Roboto@medium"
    id: font_time
    size: 300
    glyphs: "-0123456789: "
  - file: "gfonts://Roboto"
    id: font_date
    size: 64
  - file: "gfonts://Roboto@medium"
    id: font_footer
    size: 38

# Tiny placeholder so the LVGL `image` widget has a valid src at build time; the
# camera view repoints it at the live hardware-decoded frame buffer at runtime.
# Declaring an image widget also guarantees LVGL's image code (LV_USE_IMAGE) is built.
image:
  - file: placeholder.png
    id: cam_placeholder
    type: RGB565

# ── Hardware JPEG camera source (ESP32-P4) ─────────────────────────────────────
# Pulls JPEG frames from the server's living-room camera test endpoint and decodes
# them in the P4's hardware JPEG codec on a background task (see components/hw_jpeg).
# The LVGL `cam_img` widget is bound to the decoded buffer in the interval below.
hw_jpeg:
  id: cam
  host: "${lokidoki_host}"   # frames stream over UDP (TCP inbound stalls on esp-hosted #184)
  udp_port: 10701
  width: 1280
  height: 720

# ── Ambient dashboard (LVGL) ──────────────────────────────────────────────────
# Google-Hub style: when idle the screen shows a big clock; conversation states
# (driven by the satellite's face.state in Phase 2) swap the visuals. LVGL renders
# locally on the MIPI-DSI panel — the Host only sends lightweight state, not pixels.
lvgl:
  displays:
    - tab5_display
  rotation: 90                  # landscape (Google-Hub orientation)
  byte_order: little_endian     # required for the Tab5 V2 panel
  bg_color: 0x05080C            # near-black ambient background
  pages:
    - id: page_clock
      bg_color: 0x05080C
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_time
            align: CENTER
            y: -45
            text: "--:--"
            text_font: font_time
            text_color: 0xFFFFFF
        - label:
            id: lbl_date
            align: CENTER
            y: 190
            text: ""
            text_font: font_date
            text_color: 0x8DA2B5
        # Subtle conversation-state footer: a small colored pill at the bottom that
        # appears on wake/think/speak and hides when idle (clock stays visible the
        # whole time). Driven by the face_state text sensor below.
        - obj:
            id: state_footer
            align: BOTTOM_MID
            y: -34
            width: 340
            height: 76
            radius: 38
            bg_color: 0x16A34A
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - label:
                  id: state_label
                  align: CENTER
                  text: ""
                  text_font: font_footer
                  text_color: 0xFFFFFF
        # Native touch controls (top-left). Speaker = mute TTS; Mic = wake/listen
        # (boots OFF/red). Native LVGL widgets → touch works directly.
        - button:
            id: btn_mute
            align: TOP_LEFT
            x: 16
            y: 16
            width: 84
            height: 84
            radius: 42
            border_width: 0
            shadow_width: 0
            bg_color: 0x000000
            bg_opa: 45%
            widgets:
              - label:
                  id: lbl_mute
                  align: CENTER
                  text: "\uF028"
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
            on_click:
              then:
                - lambda: |-
                    id(satellite)->toggle_muted();
                    bool m = id(satellite)->is_muted();
                    lv_label_set_text(id(lbl_mute), m ? "\uF026" : "\uF028");
                    lv_obj_set_style_text_color(id(lbl_mute), lv_color_hex(0xFFFFFF), 0);
                    lv_obj_set_style_bg_color(id(btn_mute), lv_color_hex(m ? 0xDC2626 : 0x000000), 0);
                    lv_obj_set_style_bg_opa(id(btn_mute), m ? 230 : 115, 0);
        - button:
            id: btn_mic
            align: TOP_LEFT
            x: 16
            y: 112
            width: 84
            height: 84
            radius: 42
            border_width: 0
            shadow_width: 0
            bg_color: 0xDC2626    # boots red = mic off
            bg_opa: 90%
            widgets:
              - label:
                  id: lbl_mic
                  align: CENTER
                  text: "\uF001"
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
            on_click:
              then:
                - lambda: |-
                    id(satellite)->toggle_mic_enabled();
                    bool on = id(satellite)->is_mic_enabled();
                    lv_obj_set_style_text_color(id(lbl_mic), lv_color_hex(0xFFFFFF), 0);
                    lv_obj_set_style_bg_color(id(btn_mic), lv_color_hex(on ? 0x16A34A : 0xDC2626), 0);
                    lv_obj_set_style_bg_opa(id(btn_mic), 230, 0);

    # ── Full-screen camera (perf test) ─────────────────────────────────────────
    # cam_img is repointed every new frame at the hardware-decoded RGB565 buffer
    # (see the 10 ms interval). lbl_fps shows the measured frame rate + bytes/frame.
    - id: page_camera
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - image:
            id: cam_img
            src: cam_placeholder
            align: CENTER
        - obj:
            align: TOP_RIGHT
            x: -12
            y: 12
            width: 230
            height: 56
            radius: 12
            bg_color: 0x000000
            bg_opa: 65%
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_fps
                  align: CENTER
                  text: "-- fps"
                  text_font: font_footer
                  text_color: 0x00FF66

# Tick the clock once a second from network time. Skipped while the companion is
# speaking — re-rendering the 300 px time mid-reply blocks the loop long enough to
# stutter the audio (the clock just resumes a beat later, which is imperceptible).
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(face_state).state != "talking";'
          then:
            - lvgl.label.update:
                id: lbl_time
                text: !lambda |-
                  auto t = id(tab5_time).now();
                  if (!t.is_valid()) return std::string("--:--");
                  int h = t.hour % 12; if (h == 0) h = 12;
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d:%02d", h, t.minute);
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_date
                text: !lambda |-
                  auto t = id(tab5_time).now();
                  if (!t.is_valid()) return std::string("");
                  return t.strftime("%A, %b %e");
  # Local animated rain — a NATIVE LVGL layer (no network, no stream). Drops are
  # created once behind the dashboard, then nudged down each tick and wrapped at the
  # bottom. Only the small drop rectangles invalidate, so the clock/buttons aren't
  # re-rendered every frame. The loop is otherwise free, so this stays smooth and touch
  # responsive.
  # ── Camera: blit the latest hardware-decoded frame into the LVGL image ─────────
  # Runs on the main loop (LVGL is single-threaded); the fetch+decode happen on the
  # hw_jpeg background task. We only touch LVGL when a fresh frame is ready.
  - interval: 10ms
    then:
      - lambda: |-
          // One-time switch to the camera page once LVGL is fully initialised (on_boot
          // was too early). Runs here so it's guaranteed after setup.
          static bool shown = false;
          if (!shown) { lv_screen_load(id(page_camera)->obj); shown = true; }
          if (!id(cam)->has_new_frame()) return;
          int w = id(cam)->frame_w();
          int h = id(cam)->frame_h();
          if (w <= 0 || h <= 0) { id(cam)->clear_new_frame(); return; }
          static lv_image_dsc_t dsc;
          dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
          dsc.header.cf = LV_COLOR_FORMAT_RGB565;
          dsc.header.w = w;
          dsc.header.h = h;
          dsc.header.stride = w * 2;
          dsc.data = id(cam)->front_buffer();
          dsc.data_size = (uint32_t) w * h * 2;
          lv_image_set_src(id(cam_img), &dsc);
          lv_obj_invalidate(id(cam_img));
          id(cam)->clear_new_frame();

  # ── Camera: FPS + bytes/frame readout (from the decoder's running counters) ────
  - interval: 500ms
    then:
      - lambda: |-
          static uint32_t last_frames = 0;
          static uint32_t last_recv = 0;
          static uint32_t last_ms = 0;
          uint32_t now = millis();
          uint32_t f = id(cam)->frames();
          uint32_t rcv = id(cam)->received();
          float fps = 0, rfps = 0;
          if (last_ms != 0 && now > last_ms) {
            fps = (f - last_frames) * 1000.0f / (now - last_ms);
            rfps = (rcv - last_recv) * 1000.0f / (now - last_ms);
          }
          char buf[48];
          snprintf(buf, sizeof(buf), "%.0f fps  %ukB", fps, id(cam)->last_bytes() / 1024);
          lv_label_set_text(id(lbl_fps), buf);
          // received_fps vs decoded_fps: received≈decoded → decode-limited (good);
          // received≫decoded → still drop/starve-limited.
          ESP_LOGI("tab5cam", "decoded=%.1ffps received=%.1ffps last_bytes=%u dims=%dx%d",
                   fps, rfps, id(cam)->last_bytes(), id(cam)->frame_w(), id(cam)->frame_h());
          last_frames = f;
          last_recv = rcv;
          last_ms = now;

  - interval: 33ms
    then:
      - lambda: |-
          // Rain only animates on the clock page; skip it entirely while the camera
          // is up so it doesn't steal main-loop time from the frame blit.
          if (lv_screen_active() != id(page_clock)->obj) return;
          static std::vector<lv_obj_t *> drops;
          if (drops.empty()) {
            lv_obj_t *scr = lv_screen_active();
            for (int i = 0; i < 36; i++) {
              lv_obj_t *d = lv_obj_create(scr);
              lv_obj_remove_style_all(d);
              lv_obj_set_size(d, 2, 14 + (i * 7) % 26);
              lv_obj_set_style_bg_color(d, lv_color_hex(0x9FB2C8), 0);
              lv_obj_set_style_bg_opa(d, 70 + (i * 17) % 110, 0);
              lv_obj_set_style_radius(d, 1, 0);
              lv_obj_clear_flag(d, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_set_pos(d, (i * 137) % 1280, -((i * 53) % 760));
              lv_obj_move_background(d);
              drops.push_back(d);
            }
            return;
          }
          for (size_t i = 0; i < drops.size(); i++) {
            int y = lv_obj_get_y(drops[i]) + 14 + (int) (i % 4) * 4;
            if (y > 720) {
              y = -30;
              lv_obj_set_x(drops[i], (lv_obj_get_x(drops[i]) + 71) % 1280);
            }
            lv_obj_set_y(drops[i], y);
          }

# Conversation state from the satellite (idle/connecting/listening/thinking/talking).
# On each change we either hide the overlay (back to the clock) or show a bold,
# color-coded full-screen state so wake + thinking are instantly obvious.
text_sensor:
  - platform: template
    id: face_state
    on_value:
      then:
        - lambda: |-
            const std::string &s = x;
            if (s == "listening") {
              lv_label_set_text(id(state_label), "Listening");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x16A34A), 0);  // green
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else if (s == "thinking") {
              lv_label_set_text(id(state_label), "Thinking");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x2563EB), 0);  // blue
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else if (s == "talking") {
              lv_label_set_text(id(state_label), "Speaking");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x0891B2), 0);  // cyan
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else {
              // idle / connecting → footer hidden, just the clock
              lv_obj_add_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            }

external_components:
  # The shared Wyoming/Loki-Doki satellite runtime (firmware/components/).
  - source:
      type: local
      path: ../components

# ── The Loki Doki satellite link — replaces HA's voice_assistant pipeline ──────
# Streams the mic up and plays the reply down over our Wyoming gateway; wake word
# runs server-side. No RGB LED on the Tab5 — instead the conversation state is
# mirrored to the `face_state` text sensor, which drives the LVGL overlay above.
lokidoki_satellite:
  id: satellite
  host: ${lokidoki_host}
  port: ${lokidoki_port}
  model: tab5
  microphone: tab5_microphone
  speaker: tab5_speaker
  face_sensor: face_state
  backlight: backlight       # idle dimming, configured centrally via device settings
