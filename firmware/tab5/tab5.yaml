# Loki Doki — M5Stack Tab5 voice satellite (ESPHome)
#
# A 5" ESP32-P4 tablet (1280×720 MIPI-DSI, ES7210 mic array + ES8388 speaker codec,
# ESP32-C6 co-processor for Wi-Fi over SDIO) turned into a Loki Doki voice satellite.
# Like the Atom Echo it streams 16 kHz mic PCM to the Wyoming gateway and plays the
# companion's spoken reply; wake word runs SERVER-SIDE.
#
# ── HARDWARE REVISION: this config targets the NEW / "V2" Tab5 (Oct-2025+) ──────────
# That revision uses an INTEGRATED ST7123 display+touch controller (display model
# `M5Stack-Tab5-V2`), NOT the original ILI9881C + GT911 combo. Touch therefore runs on
# our vendored `st7123` component (firmware/components/st7123) at I²C 0x55 — the GT911
# is absent on this panel. The catch that cost us: pi4ioe1 P5 is the ST7123 touch
# ENABLE line (BSP_TOUCH_EN), not a "reset" — it must be strobed low→high to start the
# touch engine, or the chip ACKs I²C but reports zero coordinates. (An OLDER GT911 Tab5
# would instead need `display: model: M5Stack-Tab5` + a `touchscreen: platform: gt911`
# block at 0x5D/0x14. We pin to V2 since that's the hardware on hand.)
#
# IMPORTANT — the hardware half of this file (board, esp32_hosted, psram, i2c,
# esp_ldo, pi4ioe5v6408 expanders, i2s_audio pins, es7210/es8388 audio, mipi_dsi
# display, backlight, rtc, power switches/sensors) is copied VERBATIM from the official
# ESPHome device config so the pin map is known-good:
#   https://devices.esphome.io/devices/m5stack-tab5/
#   https://github.com/esphome/devices.esphome.io/blob/main/src/docs/devices/M5Stack-Tab5/config.yaml
# Do NOT "tune" those values. What we change vs. upstream: (1) the PIPELINE — we drop
# Home Assistant's voice_assistant/micro_wake_word/media_player and use our own
# `lokidoki_satellite` component (server-side wake, our Wyoming framing), like
# firmware/atom-echo/atom-echo.yaml; and (2) TOUCH — upstream's gt911 block is for the
# OLD revision; this V2 unit needs the `st7123` driver (see HARDWARE REVISION above).
#
# Onboarding is no-typing: flash once over USB (home Wi-Fi + server address are baked
# in at build time by Admin → Devices → "Add a device"), power on, then Claim the
# device when it announces itself.

substitutions:
  name: lokidoki-tab5
  friendly_name: LokiDoki Tab5
  lokidoki_host: "192.168.1.50"   # ← your Loki Doki server's LAN IP (injected at build)
  lokidoki_port: "10700"          # POD_GATEWAY_PORT (default 10700)
  lokidoki_http_port: "3000"      # HTTP API port — serves the server-rendered display
  # Home Wi-Fi is injected at build time by the app, so a flashed device auto-joins
  # on power-up — no per-device Wi-Fi step. Left blank here, it falls back to the
  # setup AP + Improv (serial) provisioning.
  wifi_ssid: ""
  wifi_password: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: "2026.6.0"          # Tab5 needs recent esp32_hosted / mipi_dsi support
  on_boot:
    then:
      # Read the RTC time once when the system boots (upstream).
      - rx8130.read_time:
      # Route the ES8388 DAC to LINE1 — the onboard speaker amp. Upstream exposes
      # this as a manual select; we set it automatically so audio works out of the box.
      - select.set:
          id: dac_output_select
          option: "LINE1"
      # Force the display backlight fully on at boot (don't rely on restore state).
      - light.turn_on:
          id: backlight
          brightness: 100%
      # Wake word is ALWAYS ON by default (boots live, like an Echo) — the user taps the
      # mic control to mute it for privacy. (Default mic_enabled_ is true in the component.)
      # NOTE: switching to page_camera happens from the render interval below (a
      # one-time lv_screen_load once LVGL is fully up) — doing it here in on_boot ran
      # too early and silently no-op'd (telemetry showed on_cam_page=0).
      - lambda: 'id(satellite)->set_stream_deck_page(id(page_stream_deck)->obj);'

esp32:
  variant: esp32p4
  flash_size: 16MB
  # This unit is a pre-rev3 (ECO2) P4 engineering sample — its ROM reports
  # `esp32p4-eco2`. ESPHome's own build guidance for a pre-rev3 board is to set
  # this; it targets the correct silicon revision (a rev3-built image throws
  # "Illegal instruction" at boot on ECO silicon) and caps the CPU at 360 MHz
  # (400 MHz is engineering-sample-unsafe). Drop it for production (rev3+) Tab5s.
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# Wi-Fi lives on the ESP32-C6 co-processor, reached over SDIO (esp32_hosted).
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

logger:
  hardware_uart: USB_SERIAL_JTAG
  # Audio is high-rate; keep the log level modest so it doesn't starve the loop.
  level: INFO

# Over-the-air updates after the first USB flash.
ota:
  - platform: esphome

# ── Wi-Fi: home network baked in at build time (auto-joins anywhere); the setup AP +
# Improv below are the fallback when no credentials were injected (wifi_ssid=""). ──
wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  # Keep the radio fully awake for steady real-time audio streaming + reconnects.
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

# Wi-Fi provisioning over USB serial when credentials weren't baked in.
improv_serial:

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

# On-board GPIO expanders (everything power/reset-related hangs off these).
pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

# ── Audio: ES7210 ADC (mic array) + ES8388 DAC (speaker), one shared I2S bus.
# Mic is 16 kHz (what the gateway expects); the speaker runs at 16 kHz too because
# our satellite streams raw 16 kHz mono int16 PCM down (it does not resample). ──
i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8388
    id: es8388_dac

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    # 16 kHz to match the raw PCM our satellite plays back (see note above).
    sample_rate: 16000
    # Big buffer so playback rides through the gaps between streamed TTS sentences
    # (the server synthesizes sentence-by-sentence; a small buffer underruns → the
    # reply "cuts out"). The Tab5 has PSRAM to spare. ~2 s of 16 kHz mono = ~64 KB.
    buffer_duration: 2000ms

# DAC/ADC routing selects (LINE1 = onboard speaker; set on boot above).
select:
  - platform: es8388
    dac_output:
      id: dac_output_select
      name: DAC Output
    adc_input_mic:
      name: ADC Input Mic

# ── Display + touch. The panel is driven by LVGL (see the `lvgl:` block) which
# renders the ambient clock dashboard + conversation-state faces. With LVGL present
# ESPHome skips the test card automatically. ──
display:
  - platform: mipi_dsi
    id: tab5_display
    dimensions:
      height: 1280
      width: 720
    # This unit's panel is the V2 (the V1 init sequence leaves it lit-but-blank).
    model: M5Stack-Tab5-V2
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  # M5Stack Tab5 NEW revision: integrated ST7123 display+touch. The touch engine answers
  # at I²C 0x55 (the GT911 0x5D/0x14 of the OLD revision is absent here — confirmed by bus
  # scan + M5GFX/espp). `reset_pin` is the touch ENABLE line (BSP_TOUCH_EN, expander 0x43
  # P5) which the vendored st7123 component pulses low→high to start the touch engine —
  # without that the chip ACKs I²C but never reports coordinates. Polling (no interrupt_pin)
  # for reliable reads. (Rotation transform added once raw touches are confirmed.)
  - platform: st7123
    id: touch
    address: 0x55
    update_interval: 50ms
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

time:
  - platform: rx8130
    id: rtc_time
    i2c_id: bsp_bus
    update_interval: never
    timezone: UTC
  # Network time for the on-screen clock (timezone auto-detected from the build host).
  - platform: sntp
    id: tab5_time

# ── Power / charging plumbing (all via the I/O expanders). speaker_enable must be
# ON for any audio to come out, so it restores ALWAYS_ON. ──
switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2

binary_sensor:
  - platform: gpio
    id: charging
    name: "Charging Status"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7

sensor:
  - platform: ina226
    address: 0x41
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    bus_voltage:
      id: battery_voltage
      name: "Battery Voltage"
    current:
      id: battery_current
      name: "Battery Current"
      # Positive means discharging; negative means charging.

# Big clock font (downloaded from Google Fonts at build time). The time glyph set
# is limited to what a clock needs so the large size stays small in flash.
font:
  - file: "gfonts://Roboto@medium"
    id: font_time
    size: 300
    glyphs: "-0123456789: "
  - file: "gfonts://Roboto"
    id: font_date
    size: 64
  - file: "gfonts://Roboto@medium"
    id: font_footer
    size: 38
  # Brand title for the "Connecting" boot / fallback splash.
  - file: "gfonts://Roboto@medium"
    id: font_brand
    size: 120
  - file: "gfonts://Roboto@medium"
    id: font_sd_label
    size: 28
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !@#$%^&*()-_=+[]{}|;:',.<>?/\\"
  - file: "gfonts://Roboto@medium"
    id: font_sd_icon
    size: 52
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-_"

# Tiny placeholder so the LVGL `image` widget has a valid src at build time; the
# camera view repoints it at the live hardware-decoded frame buffer at runtime.
# Declaring an image widget also guarantees LVGL's image code (LV_USE_IMAGE) is built.
image:
  - file: placeholder.png
    id: cam_placeholder
    type: RGB565
  # LokiDoki brand mark for the boot / "Connecting" splash (same logo as the app
  # bootloader). RGBA so the squircle's rounded corners stay transparent on the dark bg.
  - file: logo.png
    id: boot_logo
    type: RGB565
    transparency: alpha_channel
    resize: 200x200
  # White ear glyph for the native "tap to talk" control (rasterized lucide).
  - file: ic_mic.png
    id: img_mic
    type: RGB565
    transparency: alpha_channel
    resize: 60x60
  - file: ic_micoff.png
    id: img_micoff
    type: RGB565
    transparency: alpha_channel
    resize: 60x60

# ── Hardware JPEG camera source (ESP32-P4) ─────────────────────────────────────
# Pulls JPEG frames from the server's living-room camera test endpoint and decodes
# them in the P4's hardware JPEG codec on a background task (see components/hw_jpeg).
# The LVGL `cam_img` widget is bound to the decoded buffer in the interval below.
hw_jpeg:
  id: cam
  host: "${lokidoki_host}"   # frames stream over UDP (TCP inbound stalls on esp-hosted #184)
  udp_port: 10701
  width: 1280
  height: 720

# ── Ambient dashboard (LVGL) ──────────────────────────────────────────────────
# Google-Hub style: when idle the screen shows a big clock; conversation states
# (driven by the satellite's face.state in Phase 2) swap the visuals. LVGL renders
# locally on the MIPI-DSI panel — the Host only sends lightweight state, not pixels.
lvgl:
  displays:
    - tab5_display
  rotation: 90                  # landscape (Google-Hub orientation)
  byte_order: little_endian     # required for the Tab5 V2 panel
  bg_color: 0x05080C            # near-black ambient background
  pages:
    - id: page_clock
      bg_color: 0x05080C
      bg_opa: COVER
      widgets:
        # Boot / fallback splash, shown until the server's rendered layout streams in
        # (and again if it ever stops): a LokiDoki "Connecting" screen, like the boot
        # look. The ambient_img below covers this the instant layout frames arrive.
        # The app's brand mark with a soft violet bloom (matches the bootloader glow),
        # the LokiDoki wordmark, then "Connecting…".
        - image:
            id: boot_logo_img
            src: boot_logo
            align: CENTER
            y: -150
            # Round the widget box so the bloom hugs the logo's squircle instead of
            # glowing as a hard square (the shadow follows the object's radius).
            radius: 52
            clip_corner: true
            shadow_color: 0x8B5CF6
            shadow_width: 85
            shadow_spread: 6
            shadow_opa: 60%
        - label:
            id: lbl_brand
            align: CENTER
            y: 30
            text: "Loki Doki"
            text_font: font_brand
            text_color: 0xFFFFFF
        - label:
            id: lbl_connecting
            align: CENTER
            y: 140
            text: "Connecting..."
            text_font: font_date
            text_color: 0x8B5CF6
        # Server-rendered ambient LAYOUT (theme + widgets from Admin → Devices → Layouts),
        # hardware-decoded from the UDP frame stream (hw_jpeg `cam`, the same path the
        # camera test uses). Shown full-screen on TOP of the native clock once frames
        # arrive (see the page_clock blit interval); if the server isn't streaming, the
        # native clock/date above stay visible as a fallback. The touch buttons below are
        # created after this image, so they stay tappable on top of it.
        - image:
            id: ambient_img
            src: cam_placeholder
            align: CENTER
            hidden: true
        # MAIN-CONTENT reply panel: when a reply is delivered we clear the content band
        # (over the clock/weather image) and show the text here — the top status row and
        # the bottom controls stay visible the whole time. Driven by the reply_text sensor.
        - label:
            id: lbl_reply
            align: TOP_MID
            y: 28
            width: 1200
            height: 472
            text: ""
            text_font: font_date
            text_color: 0xFFFFFF
            bg_color: 0x0E0B1A
            bg_opa: COVER
            radius: 24
            pad_all: 28
            long_mode: wrap
            text_align: CENTER
            hidden: true
        # Bottom-CENTER conversation status pill (Listening / Thinking / Speaking),
        # shown whenever a turn is active. Driven by the face_state text sensor below.
        - obj:
            id: state_footer
            align: BOTTOM_MID
            x: 0
            y: -34
            width: 320
            height: 76
            radius: 38
            bg_color: 0x16A34A
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - label:
                  id: state_label
                  align: CENTER
                  text: ""
                  text_font: font_footer
                  text_color: 0xFFFFFF
        # Native voice controls (bottom corners) — drawn by the firmware so the icon +
        # label flip INSTANTLY on tap. Hidden until the first layout frame arrives (never
        # on the "Connecting" splash). LEFT (ear) = tap to talk. RIGHT = Voice <-> Text.
        - button:
            id: btn_wake
            align: BOTTOM_LEFT
            x: 50
            y: -64
            width: 116
            height: 116
            radius: 58
            bg_color: 0x7C3AED
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            hidden: true
            # Two stacked mic icons; we just toggle which one is visible (no runtime
            # image-src swap). mic = live, mic-with-slash = muted.
            widgets:
              - image:
                  id: ic_mic_on
                  src: img_mic
                  align: CENTER
              - image:
                  id: ic_mic_off
                  src: img_micoff
                  align: CENTER
                  hidden: true
              - label:
                  id: ic_stop
                  align: CENTER
                  text: ""
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
                  hidden: true
            # TAP = complete mute / unmute (Echo-style): swaps the icon (mic ⇄ mic-off).
            # HOLD = push-to-talk (skip the wake word), only while live. on_long_press
            # sets ptt_was_hold so the release-click doesn't also toggle mute.
            on_click:
              then:
                - lambda: |-
                    // During a turn this button is a STOP button → abort the turn.
                    if (id(ui_active)) { id(ptt_was_hold) = false; id(satellite)->request_stop(); return; }
                    if (id(ptt_was_hold)) { id(ptt_was_hold) = false; return; }
                    id(satellite)->toggle_mic_mute();
                    bool muted = id(satellite)->is_mic_muted();
                    lv_label_set_text(id(lbl_wake), muted ? "Muted" : "Listening");
                    // Dim the button to grey when muted (off), accent when live.
                    lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(muted ? 0x4B5563 : 0x7C3AED), 0);
                    if (muted) {
                      lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN);
                    } else {
                      lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN);
                    }
            on_long_press:
              then:
                - lambda: |-
                    id(ptt_was_hold) = true;
                    if (id(ui_active)) { id(satellite)->request_stop(); return; }  // in a turn → stop
                    if (!id(satellite)->is_mic_muted()) {
                      id(satellite)->request_listen();
                      lv_label_set_text(id(state_label), "Listening");
                      lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x16A34A), 0);
                      lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
                    }
        - label:
            id: lbl_wake
            align: BOTTOM_LEFT
            x: 8
            y: -16
            width: 200
            text: "Listening"
            text_font: font_sd_label
            text_color: 0xEAEAF2
            text_align: CENTER
            hidden: true
        - button:
            id: btn_voice
            align: BOTTOM_RIGHT
            x: -50
            y: -64
            width: 116
            height: 116
            radius: 58
            bg_color: 0x2563EB
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            hidden: true
            widgets:
              - label:
                  id: lbl_voice_icon
                  align: CENTER
                  text: ""
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
            on_click:
              then:
                - lambda: |-
                    id(satellite)->toggle_audio_mute();
                    bool muted = id(satellite)->is_audio_muted();
                    lv_label_set_text(id(lbl_voice_icon), muted ? "" : "");
                    lv_label_set_text(id(lbl_voice), muted ? "Sound off" : "Sound on");
                    lv_obj_set_style_bg_color(id(btn_voice), lv_color_hex(muted ? 0x4B5563 : 0x2563EB), 0);
        - label:
            id: lbl_voice
            align: BOTTOM_RIGHT
            x: -8
            y: -16
            width: 200
            text: "Sound on"
            text_font: font_sd_label
            text_color: 0xEAEAF2
            text_align: CENTER
            hidden: true
        # Server-offline banner: shown when layout frames stop arriving (server down).
        # Created last so it sits on top of the frozen last frame. Driven by the blit
        # interval's staleness check below.
        - obj:
            id: offline_banner
            align: BOTTOM_MID
            x: 0
            y: -34
            width: 480
            height: 76
            radius: 38
            bg_color: 0xF59E0B
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - label:
                  align: CENTER
                  text: "Server unreachable"
                  text_font: font_footer
                  text_color: 0x1A1205

    # ── Full-screen camera (perf test) ─────────────────────────────────────────
    # cam_img is repointed every new frame at the hardware-decoded RGB565 buffer
    # (see the 10 ms interval). lbl_fps shows the measured frame rate + bytes/frame.
    - id: page_camera
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - image:
            id: cam_img
            src: cam_placeholder
            align: CENTER
        - obj:
            align: TOP_RIGHT
            x: -12
            y: 12
            width: 230
            height: 56
            radius: 12
            bg_color: 0x000000
            bg_opa: 65%
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_fps
                  align: CENTER
                  text: "-- fps"
                  text_font: font_footer
                  text_color: 0x00FF66

    # ── Full-screen TOUCH TEST ──────────────────────────────────────────────────
    # Solid blue screen; wherever you press, a pink dot appears at that exact spot
    # and removes itself 1 s later. touch_surface fills the page and is the click
    # target; we read the press point from the active LVGL input device (already
    # rotation-corrected, so coords line up with the landscape screen). This proves
    # touch accuracy/latency across the whole panel.
    - id: page_touch
      bg_color: 0x1740C0          # blue background
      bg_opa: COVER
      widgets:
        # Full-screen BUTTON = the touch target. LVGL widget press events are the proven
        # touch path on this panel (the mute/mic buttons use them); the touchscreen
        # `on_touch` automation does NOT fire here because LVGL consumes the touch. On
        # press we read the rotation-corrected point from the active input device and
        # drop a pink dot there for 1 s, plus a running counter.
        - button:
            id: touch_btn
            x: 0
            y: 0
            width: 1280
            height: 720
            bg_color: 0x1740C0
            bg_opa: COVER
            radius: 0
            border_width: 0
            shadow_width: 0
            on_press:
              then:
                - lambda: |-
                    lv_indev_t *indev = lv_indev_get_act();
                    lv_point_t p = {0, 0};
                    if (indev) lv_indev_get_point(indev, &p);
                    const int r = 70;  // dot radius (px)
                    lv_obj_t *dot = lv_obj_create(lv_screen_active());
                    lv_obj_remove_style_all(dot);
                    lv_obj_set_size(dot, r * 2, r * 2);
                    lv_obj_set_style_radius(dot, LV_RADIUS_CIRCLE, 0);
                    lv_obj_set_style_bg_color(dot, lv_color_hex(0xFF3DAE), 0);  // pink
                    lv_obj_set_style_bg_opa(dot, LV_OPA_COVER, 0);
                    lv_obj_clear_flag(dot, LV_OBJ_FLAG_CLICKABLE);
                    lv_obj_set_pos(dot, p.x - r, p.y - r);
                    lv_obj_move_foreground(dot);
                    lv_timer_t *t = lv_timer_create([](lv_timer_t *tm) {
                      lv_obj_del((lv_obj_t *) lv_timer_get_user_data(tm));
                    }, 1000, dot);
                    lv_timer_set_repeat_count(t, 1);
                    static int n = 0; n++;
                    char buf[64];
                    snprintf(buf, sizeof(buf), "touches: %d   (%d,%d)", n, (int) p.x, (int) p.y);
                    lv_label_set_text(id(touch_count), buf);
            widgets:
              - label:
                  id: touch_count
                  align: TOP_MID
                  y: 18
                  text: "Touch the screen"
                  text_font: font_footer
                  text_color: 0xFFFFFF

    # ── Stream Deck (controller mode) ──────────────────────────────────────────
    # All button content is created dynamically in C++ (lokidoki_satellite.cpp)
    # when the server pushes stream_deck_config. This page is just the canvas.
    - id: page_stream_deck
      bg_color: 0x0f0f1a
      bg_opa: COVER

interval:
  # ── Camera: blit the latest hardware-decoded frame into the LVGL image ─────────
  # Runs on the main loop (LVGL is single-threaded); the fetch+decode happen on the
  # hw_jpeg background task. We only touch LVGL when a fresh frame is ready.
  - interval: 10ms
    then:
      - lambda: |-
          // The active page is driven by the server-pushed mode (see the display_mode
          // text sensor below); on boot it's the clock (normal). Only blit camera frames
          // while the camera page is actually showing, so the other modes keep the full
          // main loop (snappy touch response).
          if (lv_screen_active() != id(page_camera)->obj) return;
          if (!id(cam)->has_new_frame()) return;
          int w = id(cam)->frame_w();
          int h = id(cam)->frame_h();
          if (w <= 0 || h <= 0) { id(cam)->clear_new_frame(); return; }
          static lv_image_dsc_t dsc;
          dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
          dsc.header.cf = LV_COLOR_FORMAT_RGB565;
          dsc.header.w = w;
          dsc.header.h = h;
          dsc.header.stride = w * 2;
          dsc.data = id(cam)->front_buffer();
          dsc.data_size = (uint32_t) w * h * 2;
          lv_image_set_src(id(cam_img), &dsc);
          lv_obj_invalidate(id(cam_img));
          id(cam)->clear_new_frame();

  # ── Ambient: blit the latest server-rendered LAYOUT frame on the clock page ──────
  # In normal mode the server pushes this device its own rendered layout (theme +
  # widgets) over the same UDP/hw_jpeg path. Same decode path as the camera; we just
  # blit it on page_clock into ambient_img (on top of the native clock) instead.
  - interval: 100ms
    then:
      - lambda: |-
          if (lv_screen_active() != id(page_clock)->obj) return;
          static uint32_t last_frame_ms = 0;
          static bool revealed = false;
          if (id(cam)->has_new_frame()) {
            int w = id(cam)->frame_w();
            int h = id(cam)->frame_h();
            if (w <= 0 || h <= 0) { id(cam)->clear_new_frame(); return; }
            static lv_image_dsc_t dsc;
            dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
            dsc.header.cf = LV_COLOR_FORMAT_RGB565;
            dsc.header.w = w;
            dsc.header.h = h;
            dsc.header.stride = w * 2;
            dsc.data = id(cam)->front_buffer();
            dsc.data_size = (uint32_t) w * h * 2;
            lv_image_set_src(id(ambient_img), &dsc);
            lv_obj_clear_flag(id(ambient_img), LV_OBJ_FLAG_HIDDEN);
            lv_obj_invalidate(id(ambient_img));
            id(cam)->clear_new_frame();
            last_frame_ms = millis();
            // A fresh frame means the server is reachable → clear any offline banner.
            lv_obj_add_flag(id(offline_banner), LV_OBJ_FLAG_HIDDEN);
            // First real layout frame = connected. Drop the "Connecting" splash and
            // reveal the voice controls (they must NEVER show on the splash). Once only.
            if (!revealed) {
              revealed = true;
              lv_obj_add_flag(id(lbl_brand), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(lbl_connecting), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(boot_logo_img), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(btn_wake), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(lbl_wake), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(btn_voice), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(lbl_voice), LV_OBJ_FLAG_HIDDEN);
              // Reflect the RESTORED (persisted) mute settings on the controls.
              bool micMuted = id(satellite)->is_mic_muted();
              lv_label_set_text(id(lbl_wake), micMuted ? "Muted" : "Listening");
              lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(micMuted ? 0x4B5563 : 0x7C3AED), 0);
              if (micMuted) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              bool audMuted = id(satellite)->is_audio_muted();
              lv_label_set_text(id(lbl_voice), audMuted ? "Sound off" : "Sound on");
              lv_obj_set_style_bg_color(id(btn_voice), lv_color_hex(audMuted ? 0x4B5563 : 0x2563EB), 0);
              lv_label_set_text(id(lbl_voice_icon), audMuted ? "" : "");
            }
          }
          // Staleness watchdog: the server pushes layout frames continuously, so a gap
          // means it's offline. Once we've seen ≥1 frame, no frame for 6 s → show the
          // offline banner (it hides again the instant frames resume, above).
          if (revealed && last_frame_ms != 0 && (uint32_t)(millis() - last_frame_ms) > 6000) {
            lv_obj_clear_flag(id(offline_banner), LV_OBJ_FLAG_HIDDEN);
          }

  # ── Camera: FPS + bytes/frame readout (from the decoder's running counters) ────
  - interval: 500ms
    then:
      - lambda: |-
          static uint32_t last_frames = 0;
          static uint32_t last_recv = 0;
          static uint32_t last_ms = 0;
          uint32_t now = millis();
          uint32_t f = id(cam)->frames();
          uint32_t rcv = id(cam)->received();
          float fps = 0, rfps = 0;
          if (last_ms != 0 && now > last_ms) {
            fps = (f - last_frames) * 1000.0f / (now - last_ms);
            rfps = (rcv - last_recv) * 1000.0f / (now - last_ms);
          }
          char buf[48];
          snprintf(buf, sizeof(buf), "%.0f fps  %ukB", fps, id(cam)->last_bytes() / 1024);
          lv_label_set_text(id(lbl_fps), buf);
          // received_fps vs decoded_fps: received≈decoded → decode-limited (good);
          // received≫decoded → still drop/starve-limited.
          ESP_LOGI("tab5cam", "decoded=%.1ffps received=%.1ffps last_bytes=%u dims=%dx%d",
                   fps, rfps, id(cam)->last_bytes(), id(cam)->frame_w(), id(cam)->frame_h());
          last_frames = f;
          last_recv = rcv;
          last_ms = now;


# Conversation state from the satellite (idle/connecting/listening/thinking/talking).
# On each change we either hide the overlay (back to the clock) or show a bold,
# color-coded full-screen state so wake + thinking are instantly obvious.
text_sensor:
  # Server-pushed screen mode (Admin → Devices → Testing). Switches the whole UI:
  #   normal      → the ambient clock dashboard
  #   camera-test → full-screen camera (public test feed, see backend)
  #   touch-test  → blue screen, pink dot where you press
  - platform: template
    id: display_mode
    on_value:
      then:
        - lambda: |-
            const std::string &m = x;
            ESP_LOGI("displaymode", "screen mode → %s", m.c_str());
            if (m == "camera-test") {
              lv_screen_load(id(page_camera)->obj);
            } else if (m == "touch-test") {
              lv_screen_load(id(page_touch)->obj);
            } else if (m == "stream-deck") {
              lv_screen_load(id(page_stream_deck)->obj);
            } else {  // "normal" (or anything unknown) → ambient clock
              lv_screen_load(id(page_clock)->obj);
            }
  - platform: template
    id: face_state
    on_value:
      then:
        - lambda: |-
            const std::string &s = x;
            if (s == "listening") {
              lv_label_set_text(id(state_label), "Listening");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x16A34A), 0);  // green
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else if (s == "thinking") {
              lv_label_set_text(id(state_label), "Thinking");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x2563EB), 0);  // blue
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else if (s == "talking") {
              lv_label_set_text(id(state_label), "Speaking");
              lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x0891B2), 0);  // cyan
              lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            } else {
              // idle / connecting → status pill hidden, just the clock
              lv_obj_add_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
            }
            // The LEFT (mic) button becomes a STOP button while a turn is active — a tap
            // aborts it. Idle → it goes back to the mic mute/talk control.
            const bool active = (s == "listening" || s == "thinking" || s == "talking");
            id(ui_active) = active;
            if (active) {
              lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(ic_stop), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(0xDC2626), 0);  // red = stop
              lv_label_set_text(id(lbl_wake), (s == "thinking") ? "Stop thinking" : (s == "talking") ? "Stop speaking" : "Stop listening");
            } else {
              lv_obj_add_flag(id(ic_stop), LV_OBJ_FLAG_HIDDEN);
              const bool muted = id(satellite)->is_mic_muted();
              if (muted) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
              lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(muted ? 0x4B5563 : 0x7C3AED), 0);
              lv_label_set_text(id(lbl_wake), muted ? "Muted" : "Listening");
            }
  # The companion's typed reply (text-only reply mode) — show it bottom-middle.
  - platform: template
    id: reply_text
    on_value:
      then:
        - lambda: |-
            // Show the reply in the MAIN content band (covers the clock/weather); the
            // top status row + bottom controls stay visible. Buttons are never hidden.
            if (x.empty()) {
              lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(id(lbl_reply), x.c_str());
              lv_obj_clear_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
            }
        # (Re)start the auto-hide countdown on every update so the reply clears a while
        # after the LAST chunk arrives, instead of lingering on screen forever.
        - script.execute: hide_reply_timer

# Tap-vs-hold disambiguation for the mic button: on_long_press (push-to-talk) sets this,
# and the on_click that fires on release checks it so a HOLD doesn't also toggle mute.
globals:
  - id: ptt_was_hold
    type: bool
    restore_value: no
    initial_value: 'false'
  # True while a turn is active (listening/thinking/speaking). The mic button becomes a
  # Stop button during this window, so a tap aborts the turn instead of toggling mute.
  - id: ui_active
    type: bool
    restore_value: no
    initial_value: 'false'

# Auto-hide the typed reply ~22 s after the last update (mode: restart resets the
# countdown on each streamed chunk, so it only fires once the reply has settled).
script:
  - id: hide_reply_timer
    mode: restart
    then:
      - delay: 22s
      - lambda: |-
          // Reply done → clear the content panel; the clock/weather shows through again.
          lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);

external_components:
  # The shared Wyoming/Loki-Doki satellite runtime (firmware/components/).
  - source:
      type: local
      path: ../components

# ── The Loki Doki satellite link — replaces HA's voice_assistant pipeline ──────
# Streams the mic up and plays the reply down over our Wyoming gateway; wake word
# runs server-side. No RGB LED on the Tab5 — instead the conversation state is
# mirrored to the `face_state` text sensor, which drives the LVGL overlay above.
lokidoki_satellite:
  id: satellite
  host: ${lokidoki_host}
  port: ${lokidoki_port}
  model: tab5
  microphone: tab5_microphone
  speaker: tab5_speaker
  face_sensor: face_state
  mode_sensor: display_mode   # server-pushed screen mode (Admin → Devices → Testing)
  reply_sensor: reply_text    # companion's typed reply for text-only mode
  backlight: backlight       # idle dimming, configured centrally via device settings
