# Loki Doki — M5Stack Tab5 voice satellite (ESPHome)
#
# A 5" ESP32-P4 tablet (1280×720 MIPI-DSI, ES7210 mic array + ES8388 speaker codec,
# ESP32-C6 co-processor for Wi-Fi over SDIO) turned into a Loki Doki voice satellite.
# Like the Atom Echo it streams 16 kHz mic PCM to the Wyoming gateway and plays the
# companion's spoken reply; wake word runs SERVER-SIDE.
#
# ── HARDWARE REVISION: this config targets the NEW / "V2" Tab5 (Oct-2025+) ──────────
# That revision uses an INTEGRATED ST7123 display+touch controller (display model
# `M5Stack-Tab5-V2`), NOT the original ILI9881C + GT911 combo. Touch therefore runs on
# our vendored `st7123` component (firmware/components/st7123) at I²C 0x55 — the GT911
# is absent on this panel. The catch that cost us: pi4ioe1 P5 is the ST7123 touch
# ENABLE line (BSP_TOUCH_EN), not a "reset" — it must be strobed low→high to start the
# touch engine, or the chip ACKs I²C but reports zero coordinates. (An OLDER GT911 Tab5
# would instead need `display: model: M5Stack-Tab5` + a `touchscreen: platform: gt911`
# block at 0x5D/0x14. We pin to V2 since that's the hardware on hand.)
#
# IMPORTANT — the hardware half of this file (board, esp32_hosted, psram, i2c,
# esp_ldo, pi4ioe5v6408 expanders, i2s_audio pins, es7210/es8388 audio, mipi_dsi
# display, backlight, rtc, power switches/sensors) is copied VERBATIM from the official
# ESPHome device config so the pin map is known-good:
#   https://devices.esphome.io/devices/m5stack-tab5/
#   https://github.com/esphome/devices.esphome.io/blob/main/src/docs/devices/M5Stack-Tab5/config.yaml
# Do NOT "tune" those values. What we change vs. upstream: (1) the PIPELINE — we drop
# Home Assistant's voice_assistant/micro_wake_word/media_player and use our own
# `lokidoki_satellite` component (server-side wake, our Wyoming framing), like
# firmware/atom-echo/atom-echo.yaml; and (2) TOUCH — upstream's gt911 block is for the
# OLD revision; this V2 unit needs the `st7123` driver (see HARDWARE REVISION above).
#
# Onboarding is no-typing: flash once over USB (home Wi-Fi + server address are baked
# in at build time by Admin → Devices → "Add a device"), power on, then Claim the
# device when it announces itself.

substitutions:
  name: lokidoki-tab5
  friendly_name: LokiDoki Tab5
  lokidoki_host: "192.168.1.50"   # ← your Loki Doki server's LAN IP (injected at build)
  lokidoki_port: "10700"          # POD_GATEWAY_PORT (default 10700)
  lokidoki_http_port: "3000"      # HTTP API port — serves the server-rendered display
  # Home Wi-Fi is injected at build time by the app, so a flashed device auto-joins
  # on power-up — no per-device Wi-Fi step. Left blank here, it falls back to the
  # setup AP + Improv (serial) provisioning.
  wifi_ssid: ""
  wifi_password: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: "2026.6.0"          # Tab5 needs recent esp32_hosted / mipi_dsi support
  includes:
    - weather_fx.h                 # native LVGL animated weather effects (rain/snow/etc.)
  on_boot:
    then:
      # Read the RTC time once when the system boots (upstream).
      - rx8130.read_time:
      # Route the ES8388 DAC to LINE1 — the onboard speaker amp. Upstream exposes
      # this as a manual select; we set it automatically so audio works out of the box.
      - select.set:
          id: dac_output_select
          option: "LINE1"
      # Force the display backlight fully on at boot (don't rely on restore state).
      - light.turn_on:
          id: backlight
          brightness: 100%
      # Wake word is ALWAYS ON by default (boots live, like an Echo) — the user taps the
      # mic control to mute it for privacy. (Default mic_enabled_ is true in the component.)
      # NOTE: switching to page_camera happens from the render interval below (a
      # one-time lv_screen_load once LVGL is fully up) — doing it here in on_boot ran
      # too early and silently no-op'd (telemetry showed on_cam_page=0).
      # Native stream-deck grid: build it into a container ON page_clock (so the player +
      # mic/sound controls persist over it), using the real YAML fonts (icon + label).
      - lambda: |-
          id(satellite)->set_stream_deck_page(id(ctrl_native));
          id(satellite)->set_sd_fonts((void *) id(font_sd_icon), (void *) id(font_sd_label));
          id(satellite)->set_sd_atlas((void *) (esphome::image::Image *) id(ctrl_atlas));

esp32:
  variant: esp32p4
  flash_size: 16MB
  # This unit is a pre-rev3 (ECO2) P4 engineering sample — its ROM reports
  # `esp32p4-eco2`. ESPHome's own build guidance for a pre-rev3 board is to set
  # this; it targets the correct silicon revision (a rev3-built image throws
  # "Illegal instruction" at boot on ECO silicon) and caps the CPU at 360 MHz
  # (400 MHz is engineering-sample-unsafe). Drop it for production (rev3+) Tab5s.
  engineering_sample: true
  framework:
    type: esp-idf
    sdkconfig_options:
      # Boot-loop fix (esp-idf #15996, ESP32-P4 TCM). The boot-time NVS flush (ESPHome's
      # scheduler runs on the esp_timer task → global_preferences sync → nvs_commit) crashes
      # when the esp_timer task's stack is heap-placed in the 8 KB TCM (0x30100000): the
      # cache-disable safety check rejects a TCM-resident stack during the flash op. Making
      # this stack > 8 KB forces the allocator out of TCM into L2MEM. The esp_timer + main
      # tasks allocate fine at this size (static / late-heap); we deliberately do NOT touch
      # FREERTOS_TIMER_TASK_STACK_DEPTH — that task allocates so early only TCM is free, so a
      # >8 KB value there fails to allocate. Internal SRAM is plentiful for the larger stacks.
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "12288"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "12288"
    advanced:
      enable_idf_experimental_features: true

# Wi-Fi lives on the ESP32-C6 co-processor, reached over SDIO (esp32_hosted).
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

logger:
  hardware_uart: USB_SERIAL_JTAG
  # Audio is high-rate; keep the log level modest so it doesn't starve the loop.
  level: INFO

# Over-the-air updates after the first USB flash.
ota:
  - platform: esphome

# ── Wi-Fi: home network baked in at build time (auto-joins anywhere); the setup AP +
# Improv below are the fallback when no credentials were injected (wifi_ssid=""). ──
wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  # Keep the radio fully awake for steady real-time audio streaming + reconnects.
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

# Wi-Fi provisioning over USB serial when credentials weren't baked in.
improv_serial:

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

# On-board GPIO expanders (everything power/reset-related hangs off these).
pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

# ── Audio: ES7210 ADC (mic array) + ES8388 DAC (speaker), one shared I2S bus.
# Mic is 16 kHz (what the gateway expects); the speaker runs at 16 kHz too because
# our satellite streams raw 16 kHz mono int16 PCM down (it does not resample). ──
i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8388
    id: es8388_dac

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    # 16 kHz to match the raw PCM our satellite plays back (see note above).
    sample_rate: 16000
    # Big buffer so playback rides through the gaps between streamed TTS sentences
    # (the server synthesizes sentence-by-sentence; a small buffer underruns → the
    # reply "cuts out"). The Tab5 has PSRAM to spare. ~2 s of 16 kHz mono = ~64 KB.
    buffer_duration: 2000ms

# DAC/ADC routing selects (LINE1 = onboard speaker; set on boot above).
select:
  - platform: es8388
    dac_output:
      id: dac_output_select
      name: DAC Output
    adc_input_mic:
      name: ADC Input Mic

# ── Display + touch. The panel is driven by LVGL (see the `lvgl:` block) which
# renders the ambient clock dashboard + conversation-state faces. With LVGL present
# ESPHome skips the test card automatically. ──
display:
  - platform: mipi_dsi
    id: tab5_display
    dimensions:
      height: 1280
      width: 720
    # This unit's panel is the V2 (the V1 init sequence leaves it lit-but-blank).
    model: M5Stack-Tab5-V2
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  # M5Stack Tab5 NEW revision: integrated ST7123 display+touch. The touch engine answers
  # at I²C 0x55 (the GT911 0x5D/0x14 of the OLD revision is absent here — confirmed by bus
  # scan + M5GFX/espp). `reset_pin` is the touch ENABLE line (BSP_TOUCH_EN, expander 0x43
  # P5) which the vendored st7123 component pulses low→high to start the touch engine —
  # without that the chip ACKs I²C but never reports coordinates. Polling (no interrupt_pin)
  # for reliable reads. (Rotation transform added once raw touches are confirmed.)
  - platform: st7123
    id: touch
    address: 0x55
    update_interval: 50ms
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

time:
  - platform: rx8130
    id: rtc_time
    i2c_id: bsp_bus
    update_interval: never
    timezone: UTC
  # Network time for the on-screen clock (timezone auto-detected from the build host).
  - platform: sntp
    id: tab5_time

# ── Power / charging plumbing (all via the I/O expanders). speaker_enable must be
# ON for any audio to come out, so it restores ALWAYS_ON. ──
switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2

binary_sensor:
  - platform: gpio
    id: charging
    name: "Charging Status"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7

sensor:
  - platform: ina226
    address: 0x41
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    bus_voltage:
      id: battery_voltage
      name: "Battery Voltage"
    current:
      id: battery_current
      name: "Battery Current"
      # Positive means discharging; negative means charging.

# Big clock font (downloaded from Google Fonts at build time). The time glyph set
# is limited to what a clock needs so the large size stays small in flash.
font:
  - file: "gfonts://Roboto@medium"
    id: font_time
    size: 300
    glyphs: "-0123456789: "
  - file: "gfonts://Roboto"
    id: font_date
    size: 64
  - file: "gfonts://Roboto@medium"
    id: font_footer
    size: 38
  # Brand title for the "Connecting" boot / fallback splash.
  - file: "gfonts://Roboto@medium"
    id: font_brand
    size: 120
  - file: "gfonts://Roboto@medium"
    id: font_sd_label
    size: 28
    # …  = the truncation ellipsis (server sends U+2026); GF_Latin_Core covers accented
    # station/video names so neither renders as a missing-glyph box.
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !@#$%^&*()-_=+[]{}|;:',.<>?/\\…"
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@medium"
    id: font_sd_icon
    size: 52
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-_"
  # ── Native LVGL dashboard fonts ──
  # (The earlier "big font corrupts the screen" theory was wrong — the real cause was the
  # runtime display rotation, now disabled. So a large clock font is fine.)
  - file: "gfonts://Roboto@medium"
    id: font_clock_lvgl
    size: 200
    glyphs: "0123456789:- "   # '-' + space so the "--:--" placeholder isn't tofu boxes pre-SNTP
  # Weather temperature — degree glyph included so "72°" renders.
  - file: "gfonts://Roboto@medium"
    id: font_temp_lvgl
    size: 96
    glyphs: "0123456789°-"
  # Weather condition icons (Material Symbols). Only the glyphs we map weather codes to.
  - file: "gfonts://Material Symbols Outlined"
    id: font_weather_icons
    size: 88
    glyphs: [
      "\U0000F157",   # clear_day (sun)
      "\U0000F159",   # clear_night (moon)
      "\U0000F15C",   # cloud (overcast)
      "\U0000F172",   # partly_cloudy_day
      "\U0000F174",   # partly_cloudy_night
      "\U0000F176",   # rainy
      "\U0000E2CD",   # weather_snowy
      "\U0000EBDB",   # thunderstorm
      "\U0000E818",   # foggy
    ]
  # Media transport icons for the native player bar.
  - file: "gfonts://Material Symbols Outlined"
    id: font_media_icons
    size: 52
    glyphs: [
      "\U0000E037",   # play_arrow
      "\U0000E034",   # pause
      "\U0000E045",   # skip_previous
      "\U0000E044",   # skip_next
      "\U0000E5CD",   # close
      "\U0000E405",   # music_note (cover-art placeholder)
    ]

# Tiny placeholder so the LVGL `image` widget has a valid src at build time; the
# camera view repoints it at the live hardware-decoded frame buffer at runtime.
# Declaring an image widget also guarantees LVGL's image code (LV_USE_IMAGE) is built.
image:
  - file: placeholder.png
    id: cam_placeholder
    type: RGB565
  # LokiDoki brand mark for the boot / "Connecting" splash (same logo as the app
  # bootloader). RGBA so the squircle's rounded corners stay transparent on the dark bg.
  - file: logo.png
    id: boot_logo
    type: RGB565
    transparency: alpha_channel
    resize: 200x200
  # White ear glyph for the native "tap to talk" control (rasterized lucide).
  - file: ic_mic.png
    id: img_mic
    type: RGB565
    transparency: alpha_channel
    resize: 60x60
  - file: ic_micoff.png
    id: img_micoff
    type: RGB565
    transparency: alpha_channel
    resize: 60x60
  - file: ic_speaker.png
    id: img_speaker
    type: RGB565
    transparency: alpha_channel
    resize: 60x60
  - file: ic_speakeroff.png
    id: img_speakeroff
    type: RGB565
    transparency: alpha_channel
    resize: 60x60
  # Pre-dithered gradient STRIPS (8×720), one per weather condition × day/night, mirroring
  # the web app's hero gradients. Tiled across the screen at runtime (the gradient is
  # vertical, so an 8px strip tiles seamlessly) — smooth on the 16-bit panel, tiny in flash.
  # Order MUST match wxfx::gradient_key indices 0..15.
  - { file: bg/clear_day.png,    id: img_bg_0,  type: RGB565 }
  - { file: bg/clear_night.png,  id: img_bg_1,  type: RGB565 }
  - { file: bg/partly_day.png,   id: img_bg_2,  type: RGB565 }
  - { file: bg/partly_night.png, id: img_bg_3,  type: RGB565 }
  - { file: bg/cloudy_day.png,   id: img_bg_4,  type: RGB565 }
  - { file: bg/cloudy_night.png, id: img_bg_5,  type: RGB565 }
  - { file: bg/fog_day.png,      id: img_bg_6,  type: RGB565 }
  - { file: bg/fog_night.png,    id: img_bg_7,  type: RGB565 }
  - { file: bg/drizzle_day.png,  id: img_bg_8,  type: RGB565 }
  - { file: bg/drizzle_night.png,id: img_bg_9,  type: RGB565 }
  - { file: bg/rain_day.png,     id: img_bg_10, type: RGB565 }
  - { file: bg/rain_night.png,   id: img_bg_11, type: RGB565 }
  - { file: bg/snow_day.png,     id: img_bg_12, type: RGB565 }
  - { file: bg/snow_night.png,   id: img_bg_13, type: RGB565 }
  - { file: bg/storm_day.png,    id: img_bg_14, type: RGB565 }
  - { file: bg/storm_night.png,  id: img_bg_15, type: RGB565 }
  # Sun with rays — rotated at runtime for the animated clear-day sun (scene + card icon).
  - file: sun_rays.png
    id: img_sun
    type: RGB565
    transparency: alpha_channel
  # Character sprites (anti-aliased art). Order matches wxfx::sprite_table indices 0..5.
  - { file: spr/balloon.png,   id: img_spr_0, type: RGB565, transparency: alpha_channel }
  - { file: spr/ufo.png,       id: img_spr_1, type: RGB565, transparency: alpha_channel }
  - { file: spr/kite.png,      id: img_spr_2, type: RGB565, transparency: alpha_channel }
  - { file: spr/airplane.png,  id: img_spr_3, type: RGB565, transparency: alpha_channel }
  - { file: spr/bird.png,      id: img_spr_4, type: RGB565, transparency: alpha_channel }
  - { file: spr/satellite.png, id: img_spr_5, type: RGB565, transparency: alpha_channel }
  - { file: spr/petal.png,     id: img_spr_6, type: RGB565, transparency: alpha_channel }
  - { file: spr/leaf.png,      id: img_spr_7, type: RGB565, transparency: alpha_channel }
  - { file: spr/bird2.png,     id: img_spr_8, type: RGB565, transparency: alpha_channel }
  - { file: spr/airplane_a.png,id: img_spr_9, type: RGB565, transparency: alpha_channel }
  - { file: spr/airplane_b.png,id: img_spr_10,type: RGB565, transparency: alpha_channel }
  - { file: spr/airplane_a2.png,id: img_spr_11,type: RGB565, transparency: alpha_channel }
  - { file: spr/airplane_b2.png,id: img_spr_12,type: RGB565, transparency: alpha_channel }
  - { file: spr/cloud.png,      id: img_spr_13,type: RGB565, transparency: alpha_channel }
  - { file: spr/pine.png,       id: img_spr_14,type: RGB565, transparency: alpha_channel }
  - { file: spr/wear_sun.png,     id: img_spr_15,type: RGB565, transparency: alpha_channel }
  - { file: spr/wear_jacket.png,  id: img_spr_16,type: RGB565, transparency: alpha_channel }
  - { file: spr/wear_umbrella.png,id: img_spr_17,type: RGB565, transparency: alpha_channel }
  - { file: spr/wear_scarf.png,   id: img_spr_18,type: RGB565, transparency: alpha_channel }
  - { file: spr/wear_tee.png,     id: img_spr_19,type: RGB565, transparency: alpha_channel }
  - { file: spr/cow.png,          id: img_spr_20,type: RGB565, transparency: alpha_channel }
  - { file: spr/comet.png,        id: img_spr_21,type: RGB565, transparency: alpha_channel }
  - { file: spr/blimp.png,        id: img_spr_22,type: RGB565, transparency: alpha_channel }
  - { file: spr/beam.png,         id: img_spr_23,type: RGB565, transparency: alpha_channel }
  - { file: spr/tractor.png,      id: img_spr_24,type: RGB565, transparency: alpha_channel }
  - { file: spr/barn.png,         id: img_spr_25,type: RGB565, transparency: alpha_channel }
  - { file: spr/helicopter.png,   id: img_spr_26,type: RGB565, transparency: alpha_channel }
  - { file: spr/house.png,        id: img_spr_27,type: RGB565, transparency: alpha_channel }

# NOTE: the native-LVGL family photo (online_image + http_request) was removed for now —
# on this memory-tight P4 it was corrupting the display ("scrambled" band). The native
# clock + weather dashboard below stands alone; the photo will return later via a lighter
# path (the UDP/hw_jpeg channel the camera already uses, not a second TCP HTTP client).

# ── Hardware JPEG camera source (ESP32-P4) ─────────────────────────────────────
# Pulls JPEG frames from the server's living-room camera test endpoint and decodes
# them in the P4's hardware JPEG codec on a background task (see components/hw_jpeg).
# The LVGL `cam_img` widget is bound to the decoded buffer in the interval below.
hw_jpeg:
  id: cam
  host: "${lokidoki_host}"   # frames stream over UDP (TCP inbound stalls on esp-hosted #184)
  udp_port: 10701
  width: 1280
  height: 720

# ── Media-player cover art ────────────────────────────────────────────────────
# The server proxies the now-playing art at /api/pod/cover/<hwid>; the device pulls it
# into the player bar's cover slot. A SHORT timeout means a stalled fetch (the esp-hosted
# inbound-TCP hazard) just falls back to the placeholder instead of hanging.
http_request:
  timeout: 10s          # the controller atlas can take a few s to composite server-side
  watchdog_timeout: 15s

online_image:
  - id: cover_online
    url: "http://${lokidoki_host}:${lokidoki_http_port}/api/pod/cover/init.jpg"
    format: JPEG
    type: RGB565
    # Fill the slot HEIGHT (108) and let the square, corner-clipped cover box crop the width
    # → album-art "cover" fit (no letterbox bars). 16:9 art → 192×108 → centre-cropped square.
    resize: 320x108
    on_download_finished:
      - lvgl.image.update:
          id: media_cover_img
          src: cover_online
      - lambda: |-
          lv_obj_add_flag(id(media_cover_note), LV_OBJ_FLAG_HIDDEN);   // hide placeholder note
          lv_obj_clear_flag(id(media_cover_img), LV_OBJ_FLAG_HIDDEN);  // show the art
    on_error:
      - lambda: |-
          // Likely lost the shared HTTP client to the atlas download — schedule a delayed
          // retry (bounded) before giving up to the placeholder note.
          if (id(cover_retries) < 5) {
            id(cover_retries) += 1;
            id(cover_retry_at) = millis() + 1200;
          } else {
            lv_obj_clear_flag(id(media_cover_note), LV_OBJ_FLAG_HIDDEN); // give up → note
            lv_obj_add_flag(id(media_cover_img), LV_OBJ_FLAG_HIDDEN);
          }
  # Controller thumbnail atlas: 5×2 POSTER tiles of 244×180 = 1220×360, composited server-side
  # (the label sits in a strip below each poster). The grid shows each cell its tile (offset).
  - id: ctrl_atlas
    url: "http://${lokidoki_host}:${lokidoki_http_port}/api/pod/controller-atlas/init.jpg"
    format: JPEG
    type: RGB565
    resize: 1220x360
    on_download_finished:
      - lambda: 'id(satellite)->on_atlas_ready();'
    on_error:
      - lambda: |-
          ESP_LOGW("atlas", "controller atlas download failed → retrying");
          id(satellite)->atlas_retry();

# ── Ambient dashboard (LVGL) ──────────────────────────────────────────────────
# Google-Hub style: when idle the screen shows a big clock; conversation states
# (driven by the satellite's face.state in Phase 2) swap the visuals. LVGL renders
# locally on the MIPI-DSI panel — the Host only sends lightweight state, not pixels.
lvgl:
  displays:
    - tab5_display
  rotation: 270                 # landscape, FLIPPED 180° — this unit is mounted upside-down
                                # (device orientation 180). Booting already-rotated means the
                                # display is NEVER re-rotated on a live screen (which corrupted
                                # the background). The on-connect orientation push (180→270) is
                                # then a no-op the firmware guard skips. (TEST: hardcoded for
                                # this flipped unit; proper per-device boot rotation comes later.)
  byte_order: little_endian     # required for the Tab5 V2 panel
  bg_color: 0x05080C            # near-black ambient background
  pages:
    - id: page_clock
      bg_color: 0x05080C
      bg_opa: COVER
      widgets:
        # Boot / fallback splash, shown until the server's rendered layout streams in
        # (and again if it ever stops): a LokiDoki "Connecting" screen, like the boot
        # look. The ambient_img below covers this the instant layout frames arrive.
        # The app's brand mark with a soft violet bloom (matches the bootloader glow),
        # the LokiDoki wordmark, then "Connecting…".
        - image:
            id: boot_logo_img
            src: boot_logo
            align: CENTER
            y: -150
            # Round the widget box so the bloom hugs the logo's squircle instead of
            # glowing as a hard square (the shadow follows the object's radius).
            radius: 52
            clip_corner: true
            shadow_color: 0x8B5CF6
            shadow_width: 85
            shadow_spread: 6
            shadow_opa: 60%
        - label:
            id: lbl_brand
            align: CENTER
            y: 30
            text: "Loki Doki"
            text_font: font_brand
            text_color: 0xFFFFFF
        - label:
            id: lbl_connecting
            align: CENTER
            y: 140
            text: "Connecting..."
            text_font: font_date
            text_color: 0x8B5CF6
        # Server-rendered ambient LAYOUT (theme + widgets from Admin → Devices → Layouts),
        # hardware-decoded from the UDP frame stream (hw_jpeg `cam`, the same path the
        # camera test uses). Shown full-screen on TOP of the native clock once frames
        # arrive (see the page_clock blit interval); if the server isn't streaming, the
        # native clock/date above stay visible as a fallback. The touch buttons below are
        # created after this image, so they stay tappable on top of it.
        - image:
            id: ambient_img
            src: cam_placeholder
            align: CENTER
            hidden: true
        # ── NATIVE LVGL DASHBOARD (experiment, renderer: 'lvgl') ─────────────────────
        # Drawn entirely on-device — clock/date from on-board SNTP, weather from the
        # pushed display.data feed, optional family photo via online_image. Shown ONLY
        # when render_mode == "lvgl" (otherwise hidden, and the server JPEG blit above
        # drives the screen). Sits above the ambient image but below the touch grid +
        # reply panel + native controls (declared later) so those stay tappable on top.
        - obj:
            id: lvgl_dash
            x: 0
            y: 0
            width: 1280
            height: 720
            bg_color: 0x0B1020
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            radius: 0
            scrollbar_mode: "OFF"
            scrollable: false
            hidden: true
            widgets:
              # Smooth (pre-dithered) gradient background image, full-screen, behind all.
              - image:
                  id: bg_img
                  src: img_bg_1
                  align: TOP_LEFT
                  x: 0
                  y: 0
              # Full-screen animated weather effects layer — sits ABOVE the background image
              # but behind the clock/weather. Populated at runtime (rain/snow/lightning/
              # clouds/fog/stars) by wxfx::apply_weather_fx() from the display.data handler.
              - obj:
                  id: lv_wx_fx
                  x: 0
                  y: 0
                  width: 1280
                  height: 720
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  scrollbar_mode: "OFF"
                  scrollable: false
                  clickable: false
              # Hidden dummy line — forces ESPHome to compile LVGL's line widget so the
              # shooting-star streaks (created in C++ in weather_fx.h) link.
              - line:
                  id: lv_dummy_line
                  hidden: true
                  points:
                    - [0, 0]
                    - [2, 2]
              # Clock + date on the left, weather card on the right. Big clock font now;
              # gradient background (navy → violet); weather card has its own sky gradient.
              - label:
                  id: lv_clock
                  align: LEFT_MID
                  x: 24
                  y: -166
                  width: 524
                  text_align: RIGHT
                  text: "--:--"
                  text_font: font_clock_lvgl
                  text_color: 0xFFFFFF
              # Seconds + AM/PM stacked to the right of the big time (like the web design).
              - label:
                  id: lv_seconds
                  align: LEFT_MID
                  x: 560
                  y: -206
                  text: ""
                  text_font: font_date
                  text_color: 0xFFFFFF
              - label:
                  id: lv_ampm
                  align: LEFT_MID
                  x: 564
                  y: -144
                  text: ""
                  text_font: font_footer
                  text_color: 0xC8D4FF
              - label:
                  id: lv_date
                  align: LEFT_MID
                  x: 24
                  y: -14
                  width: 524
                  text_align: RIGHT
                  text: ""
                  text_font: font_date
                  text_color: 0xFFFFFF
              - obj:
                  id: lv_wx_card
                  align: RIGHT_MID
                  x: -48
                  y: -100
                  width: 320
                  height: 392
                  # Glassmorphic card: translucent navy with a vertical gradient + hairline
                  # border (futuristic weather-card look; the animated sky shows through).
                  bg_opa: 52%
                  bg_color: 0x141F36
                  border_width: 1
                  border_color: 0xA9C0E8
                  border_opa: 30%
                  radius: 32
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  scrollable: false
                  clickable: false   # not interactive → swipes over it pass to the gesture detector
                  # No icon + no panel — the animated background conveys the weather. Just text.
                  widgets:
                    - label:
                        id: lv_wx_temp
                        align: TOP_MID
                        y: 26
                        text: "--°"
                        text_font: font_temp_lvgl
                        text_color: 0xFFFFFF
                    - label:
                        id: lv_wx_cond
                        align: TOP_MID
                        y: 136
                        width: 292
                        text: ""
                        text_font: font_footer
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        long_mode: wrap
                    - label:
                        id: lv_wx_hilo
                        align: TOP_MID
                        y: 200
                        text: ""
                        text_font: font_footer
                        text_color: 0xEAF0FF
                    # Suggested-wear icons (sunglasses / jacket / umbrella / scarf / tee),
                    # auto-centred via a flex row; unused slots are hidden at runtime.
                    - obj:
                        id: lv_wear_row
                        align: TOP_MID
                        y: 250
                        width: 300
                        height: 76
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_main: center
                          flex_align_cross: center
                          flex_align_track: center
                          pad_column: 22
                        widgets:
                          - image: { id: lv_wear0, src: img_spr_19 }
                          - image: { id: lv_wear1, src: img_spr_19 }
                          - image: { id: lv_wear2, src: img_spr_19 }
              # Location sits OUTSIDE the weather card, centred just below it.
              - label:
                  id: lv_wx_loc
                  align: RIGHT_MID
                  x: -48
                  y: 132
                  width: 320
                  text: ""
                  text_font: font_footer
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  long_mode: dot
        # NATIVE controller grid: the satellite component draws button cells into this
        # container from the server-pushed stream-deck descriptor (real fonts + colours,
        # instant taps → button_press, no server-rendered frames). Full-screen dark backdrop;
        # the bottom row is left empty for the mic/sound/player band that overlays on top.
        - obj:
            id: ctrl_native
            x: 0
            y: 0
            width: 1280
            height: 720
            hidden: true
            bg_color: 0x070B14
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            radius: 0
            scrollbar_mode: "OFF"
            scrollable: false
        # Invisible touch grid over the rendered CONTROLLER image: 2 rows × 5 cols across
        # the TOP TWO rows only (the bottom row is the mic/sound/status band). Hidden in the
        # display view; revealed on swipe. Each cell turns a tap on the rendered button into
        # a button_press(row,col) the server resolves against the controller layout. It sits
        # below the reply panel + controls (declared later) so those stay tappable on top.
        # (Kept for the server-rendered fallback path; native mode uses ctrl_native above.)
        - obj:
            id: touch_grid
            x: 0
            y: 0
            width: 1280
            height: 480
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            radius: 0
            scrollbar_mode: "OFF"
            scrollable: false   # so a drag over the grid becomes a swipe gesture, not a scroll
            hidden: true
            widgets:
              - button: { x: 0,    y: 0,   width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 0, 0);' ] } }
              - button: { x: 256,  y: 0,   width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 0, 1);' ] } }
              - button: { x: 512,  y: 0,   width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 0, 2);' ] } }
              - button: { x: 768,  y: 0,   width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 0, 3);' ] } }
              - button: { x: 1024, y: 0,   width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 0, 4);' ] } }
              - button: { x: 0,    y: 240, width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 1, 0);' ] } }
              - button: { x: 256,  y: 240, width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 1, 1);' ] } }
              - button: { x: 512,  y: 240, width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 1, 2);' ] } }
              - button: { x: 768,  y: 240, width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 1, 3);' ] } }
              - button: { x: 1024, y: 240, width: 256, height: 240, bg_opa: TRANSP, border_width: 0, shadow_width: 0, scrollable: false, on_press: { then: [ lambda: 'id(g_swiping) = false;' ] }, on_click: { then: [ lambda: 'if (!id(g_swiping)) id(satellite)->send_button_press_("dashboard", 1, 4);' ] } }
        # MAIN-CONTENT reply panel: when a reply is delivered we clear the content band
        # (over the clock/weather image) and show the text here — the top status row and
        # the bottom controls stay visible the whole time. Driven by the reply_text sensor.
        - label:
            id: lbl_reply
            align: TOP_MID
            y: 6
            width: 1200
            height: 510
            text: ""
            text_font: font_date
            text_color: 0xFFFFFF
            bg_color: 0x0E0B1A
            bg_opa: COVER
            radius: 24
            pad_all: 28
            long_mode: wrap
            text_align: CENTER
            hidden: true
        # Dismiss button on the reply panel — lets the user clear the reply text early
        # (shown/hidden in lock-step with lbl_reply). Top-right corner of the panel.
        - button:
            id: btn_dismiss_reply
            align: TOP_MID
            x: 0
            y: 446
            width: 180
            height: 58
            radius: 29
            bg_color: 0x3A3450
            bg_opa: COVER
            border_width: 0
            hidden: true
            widgets:
              - label:
                  align: CENTER
                  text: "Dismiss"
                  text_font: font_sd_label
                  text_color: 0xFFFFFF
            on_click:
              then:
                - script.stop: hide_reply_timer
                - script.stop: hide_reply_soon
                - script.execute: hide_reply_now
        # Bottom-CENTER conversation status pill (Listening / Thinking / Speaking),
        # shown whenever a turn is active. Driven by the face_state text sensor below.
        - obj:
            id: state_footer
            align: BOTTOM_MID
            x: 0
            y: -34
            width: 320
            height: 76
            radius: 38
            bg_color: 0x16A34A
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - label:
                  id: state_label
                  align: CENTER
                  text: ""
                  text_font: font_footer
                  text_color: 0xFFFFFF
        # Native voice controls (bottom corners) — drawn by the firmware so the icon +
        # label flip INSTANTLY on tap. Hidden until the first layout frame arrives (never
        # on the "Connecting" splash). LEFT (ear) = tap to talk. RIGHT = Voice <-> Text.
        - button:
            id: btn_wake
            align: BOTTOM_LEFT
            x: 50
            y: -64
            width: 116
            height: 116
            radius: 58
            bg_color: 0x7C3AED
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            hidden: true
            # Two stacked mic icons; we just toggle which one is visible (no runtime
            # image-src swap). mic = live, mic-with-slash = muted.
            widgets:
              - image:
                  id: ic_mic_on
                  src: img_mic
                  align: CENTER
              - image:
                  id: ic_mic_off
                  src: img_micoff
                  align: CENTER
                  hidden: true
              - label:
                  id: ic_stop
                  align: CENTER
                  text: ""
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
                  hidden: true
            # TAP = complete mute / unmute (Echo-style): swaps the icon (mic ⇄ mic-off).
            # HOLD = push-to-talk (skip the wake word), only while live. on_long_press
            # sets ptt_was_hold so the release-click doesn't also toggle mute.
            on_click:
              then:
                - lambda: |-
                    // During a turn this button is a STOP button → abort the turn AND snap
                    // the UI back to idle locally. The server may already believe it's idle
                    // (so it won't echo another idle face.state), which would otherwise leave
                    // this pill stuck on "Thinking".
                    if (id(ui_active)) {
                      id(ptt_was_hold) = false;
                      id(satellite)->request_stop();
                      id(ui_active) = false;
                      lv_obj_add_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(btn_dismiss_reply), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(ic_stop), LV_OBJ_FLAG_HIDDEN);
                      bool m = id(satellite)->is_mic_muted();
                      if (m) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
                      else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
                      lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(m ? 0x4B5563 : 0x7C3AED), 0);
                      lv_label_set_text(id(lbl_wake), m ? "Muted" : "Listening");
                      return;
                    }
                    if (id(ptt_was_hold)) { id(ptt_was_hold) = false; return; }
                    id(satellite)->toggle_mic_mute();
                    bool muted = id(satellite)->is_mic_muted();
                    lv_label_set_text(id(lbl_wake), muted ? "Muted" : "Listening");
                    // Dim the button to grey when muted (off), accent when live.
                    lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(muted ? 0x4B5563 : 0x7C3AED), 0);
                    if (muted) {
                      lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN);
                    } else {
                      lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN);
                    }
            on_long_press:
              then:
                - lambda: |-
                    id(ptt_was_hold) = true;
                    if (id(ui_active)) {  // in a turn → stop + snap back to idle locally
                      id(satellite)->request_stop();
                      id(ui_active) = false;
                      lv_obj_add_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(btn_dismiss_reply), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(ic_stop), LV_OBJ_FLAG_HIDDEN);
                      bool m = id(satellite)->is_mic_muted();
                      if (m) { lv_obj_add_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
                      else { lv_obj_clear_flag(id(ic_mic_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_mic_off), LV_OBJ_FLAG_HIDDEN); }
                      lv_obj_set_style_bg_color(id(btn_wake), lv_color_hex(m ? 0x4B5563 : 0x7C3AED), 0);
                      lv_label_set_text(id(lbl_wake), m ? "Muted" : "Listening");
                      return;
                    }
                    if (!id(satellite)->is_mic_muted()) {
                      id(satellite)->request_listen();
                      lv_label_set_text(id(state_label), "Listening");
                      lv_obj_set_style_bg_color(id(state_footer), lv_color_hex(0x16A34A), 0);
                      lv_obj_clear_flag(id(state_footer), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(lbl_reply), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(btn_dismiss_reply), LV_OBJ_FLAG_HIDDEN);
                    }
        - label:
            id: lbl_wake
            align: BOTTOM_LEFT
            x: 8
            y: -16
            width: 200
            text: "Listening"
            text_font: font_sd_label
            text_color: 0xEAEAF2
            text_align: CENTER
            hidden: true
        - button:
            id: btn_voice
            align: BOTTOM_RIGHT
            x: -50
            y: -64
            width: 116
            height: 116
            radius: 58
            bg_color: 0x2563EB
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            hidden: true
            widgets:
              - image:
                  id: ic_spk_on
                  src: img_speaker
                  align: CENTER
              - image:
                  id: ic_spk_off
                  src: img_speakeroff
                  align: CENTER
                  hidden: true
            on_click:
              then:
                - lambda: |-
                    id(satellite)->toggle_audio_mute();
                    bool muted = id(satellite)->is_audio_muted();
                    lv_label_set_text(id(lbl_voice), muted ? "Sound off" : "Sound on");
                    lv_obj_set_style_bg_color(id(btn_voice), lv_color_hex(muted ? 0x4B5563 : 0x2563EB), 0);
                    if (muted) { lv_obj_add_flag(id(ic_spk_on), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(ic_spk_off), LV_OBJ_FLAG_HIDDEN); }
                    else { lv_obj_clear_flag(id(ic_spk_on), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(ic_spk_off), LV_OBJ_FLAG_HIDDEN); }
        - label:
            id: lbl_voice
            align: BOTTOM_RIGHT
            x: -8
            y: -16
            width: 200
            text: "Sound on"
            text_font: font_sd_label
            text_color: 0xEAEAF2
            text_align: CENTER
            hidden: true
        # Server-offline banner: shown when layout frames stop arriving (server down).
        # Created last so it sits on top of the frozen last frame. Driven by the blit
        # interval's staleness check below.
        - obj:
            id: offline_banner
            align: BOTTOM_MID
            x: 0
            y: -34
            width: 480
            height: 76
            radius: 38
            bg_color: 0xF59E0B
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - label:
                  align: CENTER
                  text: "Server unreachable"
                  text_font: font_footer
                  text_color: 0x1A1205

        # ── Native media player bar (driven by display.data `media`; shows on BOTH the
        # dashboard and controller since it's a page_clock sibling). Transport taps send
        # media commands the server forwards to the browser engine. ✕ dismisses it. ──
        - obj:
            id: media_bar
            align: BOTTOM_MID
            y: -52
            width: 880
            height: 140
            hidden: true
            radius: 24
            bg_color: 0x0C1626
            bg_opa: 72%
            border_width: 1
            border_color: 0xA9C0E8
            border_opa: 28%
            pad_all: 0
            scrollbar_mode: "OFF"
            scrollable: false
            widgets:
              - obj:
                  id: media_cover
                  align: LEFT_MID
                  x: 20
                  y: 0
                  width: 108
                  height: 108
                  radius: 16
                  clip_corner: true
                  bg_color: 0x1C2A46
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  scrollable: false
                  widgets:
                    - image:
                        id: media_cover_img
                        src: cam_placeholder
                        align: CENTER
                        hidden: true
                    - label:
