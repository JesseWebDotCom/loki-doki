<!doctype html>
<!--
  Offline fallback, served by the service worker (sw.js) when a navigation fails
  because the server is unreachable. Fully self-contained (inline SVG + CSS + JS,
  no external assets) so it renders even with an empty cache.

  Mirrors BootScreen.tsx: brand mark with glow, shimmer progress bar, quiet label.
  Polls /api/health; ANY response (even a boot-gate 503) means the server is back,
  so we reload the originally requested URL (this page is served *as* that URL).

  Precached by sw.js at install — bump CACHE_VERSION there when editing this file.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0f" />
    <title>Loki Doki</title>
    <script>
      // Same theme bootstrap as index.html so this page matches the user's theme.
      try {
        const t = localStorage.getItem("theme");
        const effective =
          t === "light" || t === "dark"
            ? t
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", effective);
      } catch { /* default dark */ }
    </script>
    <style>
      :root {
        --background: oklch(0.985 0.004 300);
        --foreground: oklch(0.17 0.025 300);
        --muted: oklch(0.955 0.008 300);
        --muted-foreground: oklch(0.49 0.024 295);
        --brand: oklch(0.5 0.21 288);
        --brand-hover: oklch(0.45 0.2 288);
        --brand-foreground: oklch(0.99 0 0);
        --warning: oklch(0.6 0.14 75);
      }
      :root[data-theme="dark"] {
        --background: oklch(0.16 0.022 300);
        --foreground: oklch(0.965 0.008 300);
        --muted: oklch(0.25 0.026 300);
        --muted-foreground: oklch(0.7 0.03 295);
        --brand: oklch(0.72 0.16 288);
        --brand-hover: oklch(0.76 0.15 288);
        --brand-foreground: oklch(0.16 0.022 300);
        --warning: oklch(0.78 0.16 80);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .glow {
        position: fixed;
        left: 50%;
        top: 40%;
        width: 600px;
        height: 600px;
        transform: translate(-50%, -50%);
        border-radius: 9999px;
        background: color-mix(in oklch, var(--brand) 10%, transparent);
        filter: blur(140px);
        pointer-events: none;
      }
      .card {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 320px;
        padding: 0 16px;
      }
      .mark {
        width: 72px;
        height: 72px;
        user-select: none;
        filter: drop-shadow(0 0 16px rgba(124, 58, 237, 0.55)) drop-shadow(0 8px 48px rgba(139, 92, 246, 0.45));
      }
      h1 { margin-top: 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }
      .tagline { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }
      .bar-wrap { margin-top: 40px; width: 100%; }
      .bar {
        position: relative;
        height: 4px;
        width: 100%;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--muted);
      }
      .bar-fill {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: linear-gradient(90deg, var(--brand), var(--brand-hover));
        opacity: 0.35;
      }
      .bar-shimmer {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 60px;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
        animation: shimmer 1.6s ease-in-out infinite;
      }
      @keyframes shimmer {
        0% { left: -60px; }
        100% { left: 100%; }
      }
      .label {
        margin-top: 10px;
        text-align: center;
        font-size: 12px;
        color: color-mix(in oklch, var(--muted-foreground) 60%, transparent);
        transition: color 0.3s;
      }
      .notice {
        display: none;
        margin-top: 32px;
        width: 100%;
        border: 1px solid color-mix(in oklch, var(--warning) 20%, transparent);
        background: color-mix(in oklch, var(--warning) 5%, transparent);
        border-radius: 14px;
        padding: 12px 16px;
      }
      .notice-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--warning);
      }
      .notice-body {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted-foreground);
      }
      .retry {
        display: none;
        margin-top: 16px;
        width: 100%;
        height: 36px;
        border: none;
        border-radius: 10px;
        background: var(--brand);
        color: var(--brand-foreground);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .retry:hover { background: var(--brand-hover); }
      body.unreachable .notice, body.unreachable .retry { display: block; }
      body.unreachable .bar-shimmer { animation-duration: 3.2s; }
      body.unreachable .label { color: var(--warning); }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="card">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 810" role="img" aria-label="Loki Doki">
        <defs>
          <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#221636"/>
            <stop offset="100%" stop-color="#14101f"/>
          </linearGradient>
          <linearGradient id="grad" x1="180" y1="170" x2="640" y2="660" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6fe0ff"/>
            <stop offset="38%" stop-color="#7c8bff"/>
            <stop offset="70%" stop-color="#b06bff"/>
            <stop offset="100%" stop-color="#ff6ad0"/>
          </linearGradient>
        </defs>
        <rect x="22" y="22" width="766" height="766" rx="188" ry="188" fill="url(#tile)"/>
        <rect x="30" y="30" width="750" height="750" rx="182" ry="182" fill="none" stroke="#6a4fb0" stroke-opacity="0.3" stroke-width="3"/>
        <g fill="url(#grad)">
          <path d="M 150 150 L 236 150 L 236 574 L 660 574 L 660 660 L 150 660 Z"/>
          <circle cx="445" cy="210" r="22"/><circle cx="393" cy="262" r="22"/><circle cx="445" cy="262" r="22"/><circle cx="497" cy="262" r="22"/>
          <circle cx="341" cy="314" r="22"/><circle cx="393" cy="314" r="22"/><circle cx="445" cy="314" r="22"/><circle cx="497" cy="314" r="22"/><circle cx="549" cy="314" r="22"/>
          <circle cx="289" cy="366" r="22"/><circle cx="341" cy="366" r="22"/><circle cx="393" cy="366" r="22"/><circle cx="445" cy="366" r="22"/><circle cx="497" cy="366" r="22"/><circle cx="549" cy="366" r="22"/><circle cx="601" cy="366" r="22"/>
          <circle cx="341" cy="418" r="22"/><circle cx="393" cy="418" r="22"/><circle cx="445" cy="418" r="22"/><circle cx="497" cy="418" r="22"/><circle cx="549" cy="418" r="22"/>
          <circle cx="341" cy="470" r="22"/><circle cx="393" cy="470" r="22"/><circle cx="497" cy="470" r="22"/><circle cx="549" cy="470" r="22"/>
          <circle cx="341" cy="522" r="22"/><circle cx="393" cy="522" r="22"/><circle cx="497" cy="522" r="22"/><circle cx="549" cy="522" r="22"/>
        </g>
      </svg>
      <h1>Loki Doki</h1>
      <p class="tagline">Your private AI home hub</p>

      <div class="bar-wrap">
        <div class="bar">
          <div class="bar-fill"></div>
          <div class="bar-shimmer"></div>
        </div>
        <p class="label" id="label">Connecting&hellip;</p>
      </div>

      <div class="notice">
        <p class="notice-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
          </svg>
          Can&rsquo;t reach your server
        </p>
        <p class="notice-body">
          Make sure the Loki Doki server is powered on and this device is connected to your home network. We&rsquo;ll keep trying in the background.
        </p>
      </div>
      <button class="retry" type="button" id="retry">Try again</button>
    </div>

    <script>
      const label = document.getElementById("label");
      const FAST_MS = 2500;   // while "Connecting…"
      const SLOW_MS = 6000;   // after we've given up hope of a quick reconnect
      const GIVE_UP_AFTER = 4; // consecutive failures before showing the notice
      let failures = 0;
      let timer = null;
      let probing = false;

      async function probe() {
        if (probing) return;
        probing = true;
        try {
          // Any HTTP response means the server is reachable (a 503 just means it's
          // still booting — the app's own BootScreen takes over from there).
          await fetch("/api/health", { cache: "no-store", signal: AbortSignal.timeout(4000) });
          label.textContent = "Connected — loading…";
          // If health responds but the navigation itself keeps failing, the SW lands us
          // back here after every reload — space the reloads out instead of spinning.
          const last = Number(sessionStorage.getItem("ld-offline-reload") || 0);
          const now = Date.now();
          sessionStorage.setItem("ld-offline-reload", String(now));
          setTimeout(() => location.reload(), now - last < 8000 ? 3000 : 0);
          return;
        } catch {
          failures += 1;
          if (failures >= GIVE_UP_AFTER) {
            document.body.classList.add("unreachable");
            label.textContent = "Still trying…";
          }
        } finally {
          probing = false;
        }
        timer = setTimeout(probe, failures >= GIVE_UP_AFTER ? SLOW_MS : FAST_MS);
      }

      document.getElementById("retry").addEventListener("click", () => {
        if (timer) clearTimeout(timer);
        label.textContent = "Connecting…";
        probe();
      });

      // Network coming back online is the strongest signal — probe immediately.
      window.addEventListener("online", () => {
        if (timer) clearTimeout(timer);
        probe();
      });

      probe();
    </script>
  </body>
</html>
