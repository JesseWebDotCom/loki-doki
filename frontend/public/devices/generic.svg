<svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voice device">
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <ellipse cx="48" cy="84" rx="24" ry="4.5" fill="#000" opacity="0.16"/>
  <!-- rounded puck body -->
  <rect x="24" y="20" width="48" height="54" rx="16" fill="url(#g-body)"/>
  <rect x="28" y="24" width="40" height="20" rx="10" fill="#fff" opacity="0.12"/>
  <!-- mic dot -->
  <circle cx="48" cy="40" r="6" fill="#fff" opacity="0.92"/>
  <circle cx="48" cy="40" r="6" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <!-- sound waves -->
  <path d="M60 34 a10 10 0 0 1 0 12" stroke="#fff" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M36 34 a10 10 0 0 0 0 12" stroke="#fff" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- status line -->
  <rect x="38" y="58" width="20" height="3.5" rx="1.75" fill="#fff" opacity="0.5"/>
</svg>
